openapi: "3.1.0"
info:
  title: VantaDB HTTP API
  version: "0.5.0"
  description: |
    REST interface for the VantaDB HTTP server.

    VantaDB is a high-performance vector-native knowledge graph database
    with IQL (Interactive Query Language) for semantic memory operations,
    hybrid search, and graph traversal.

    The HTTP server is optional and enabled via `vanta-cli server --http`
    or the `server` Cargo feature.

    Parity contract: every route registered in `src/server/router.rs`
    (`app_with_cors` + dashboard fallback via `mount_dashboard`) must appear
    here with matching methods — enforced by `scripts/check_openapi_parity.mjs`
    in CI (gate-docs-21). Endpoints marked `x-experimental: true` are unstable
    and may change without notice.
  contact:
    name: VantaDB Project
  license:
    name: Apache-2.0

servers:
  - url: http://127.0.0.1:8080
    description: Local development server (default)
  - url: https://{host}:{port}
    description: Production server with TLS
    variables:
      host:
        default: localhost
      port:
        default: "443"

tags:
  - name: System
    description: Health, metrics, audit and platform endpoints
  - name: Query
    description: IQL query execution
  - name: Records
    description: Record CRUD, listing, versions and data transfer
  - name: Search
    description: Vector / hybrid search and autocomplete
  - name: Graph
    description: Graph traversal and analytics
  - name: Maintenance
    description: Storage maintenance operations and snapshots
  - name: Threads
    description: Conversation threads

paths:
  /health:
    get:
      summary: Liveness check
      description: Returns OK when the server is running. Unauthenticated.
      operationId: healthCheck
      tags:
        - System
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /metrics:
    get:
      summary: Prometheus metrics
      description: |
        Exposes operational metrics in Prometheus/OpenMetrics text format
        (Content-Type: text/plain; version=0.0.4) for scraping by Prometheus
        or any OpenMetrics-compatible collector.
      operationId: prometheusMetrics
      tags:
        - System
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Metrics text
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP vantadb_http_requests_total Total HTTP requests
                  # TYPE vantadb_http_requests_total counter
                  vantadb_http_requests_total{method="GET",route="/health",status="200"} 42
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /dashboard:
    get:
      summary: Web console entry point
      description: |
        Serves the Vanta Studio console when started with `--dashboard-dir`;
        otherwise returns 404 with a hint to enable it (WEB-03).
      operationId: dashboardDisabled
      tags:
        - System
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard index.html (when --dashboard-dir configured)
          content:
            text/html:
              schema:
                type: string
        "404":
          description: Dashboard not enabled
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /dashboard/{path}:
    get:
      summary: Web console static assets
      description: Static file serving fallback for the dashboard SPA.
      operationId: dashboardStaticPath
      tags:
        - System
      security:
        - bearerAuth: []
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Static asset or index.html fallback
        "404":
          description: Asset not found or dashboard not enabled
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v2/query:
    post:
      summary: Execute IQL query
      description: |
        Execute an IQL (Interactive Query Language) statement against the database.

        Supported operations are passed as a single IQL query string:

        ## Read Operations

        **Query (search):** Scan an entity with optional filters, vector similarity search, graph traversal, sorting, and projection.
        ```
        from <entity> [where <field> <op> <value>] [rank by <field> [asc|desc]] [fetch <field>,...]
        ```

        **Vector/hybrid search:** Include a vector similarity condition in the WHERE clause.
        ```
        from <entity> where vec(<field>) <~> <text_query> [min_score <n>]
        ```

        **Graph traversal:** Follow edges from matched nodes.
        ```
        from <entity> SIGUE <min>..<max> "<edge_label>" [TYPE <type>] [AS <alias>]
        ```

        ## Write Operations

        **Insert:** Create a new node.
        ```
        insert <id> as <type> [fields <key>=<value>,...] [with vector [<f32>,...]]
        ```

        **Update:** Modify an existing node's fields or vector.
        ```
        update <id> [set <key>=<value>,...] [with vector [<f32>,...]]
        ```

        **Delete:** Remove a node.
        ```
        delete <id>
        ```

        **Relate:** Create a weighted or unweighted edge between two nodes.
        ```
        relate <source_id> -> <target_id> as <label> [weight <f32>]
        ```

        **Insert Message (conversational sugar):** Create a threaded message node with automatic embedding.
        ```
        message <role> "<content>" in thread <thread_id>
        ```
      operationId: executeQuery
      tags:
        - Query
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: Query executed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v2/health:
    get:
      summary: Authenticated health check
      description: Same liveness probe as `/health`, served behind auth middleware.
      operationId: healthV2
      tags:
        - System
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v2/records:
    post:
      summary: Put record
      description: Create or overwrite a memory record (upsert by namespace+key).
      operationId: putRecord
      tags:
        - Records
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordInput"
      responses:
        "200":
          description: Record stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AckResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      summary: Delete records by metadata filter
      description: Deletes all records in a namespace whose metadata matches the JSON filter string passed as query parameter.
      operationId: deleteRecordsByFilter
      tags:
        - Records
      security:
        - bearerAuth: []
      parameters:
        - name: namespace
          in: query
          required: true
          schema:
            type: string
        - name: filter
          in: query
          required: true
          description: JSON-encoded metadata filter (`VantaMemoryFilter`)
          schema:
            type: string
      responses:
        "200":
          description: Matching records deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AckResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v2/records/batch:
    post:
      summary: Put records batch
      description: Upsert multiple records in one call (array of `RecordInput`).
      operationId: putRecordsBatch
      tags:
        - Records
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/RecordInput"
      responses:
        "200":
          description: Batch stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AckResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v2/records/{ns}/{key}:
    get:
      summary: Get record
      description: Fetch a single record by namespace and key.
      operationId: getRecord
      tags:
        - Records
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespacePath"
        - $ref: "#/components/parameters/KeyPath"
      responses:
        "200":
          description: The stored record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      summary: Delete record
      description: Soft-delete (tombstone) a record by namespace and key.
      operationId: deleteRecord
      tags:
        - Records
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespacePath"
        - $ref: "#/components/parameters/KeyPath"
      responses:
        "200":
          description: Record deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AckResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v2/records/{ns}/{key}/versions:
    get:
      summary: List record versions
      description: Version history of a record.
      operationId: listRecordVersions
      tags:
        - Records
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NamespacePath"
        - $ref: "#/components/parameters/KeyPath"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Version list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v2/list:
    get:
      summary: List records
      description: Paginated listing of records in a namespace, with optional metadata filter ops.
      operationId: listRecords
      tags:
        - Records
      security:
        - bearerAuth: []
      parameters:
        - name: namespace
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: cursor
          in: query
          schema:
            type: string
        - name: filter_ops
          in: query
          description: JSON-encoded filter ops
          schema:
            type: string
      responses:
        "200":
          description: Page of records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListPageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v2/search:
    post:
      summary: Hybrid search
      description: |
        Vector / sparse / BM25 hybrid similarity search over a namespace,
        with offset pagination (`cursor` = zero-based offset, `limit` = page
        size; defaults to `top_k`). Wire format mirrors the SDK's
        `VantaMemorySearchRequest`.

        **Fresh database note:** On server startup, `ensure_indexes_current()` is
        called automatically (see `src/cli_server.rs`) to initialize text/BM25
        indexes for new databases. This prevents "text_index not found" errors.
        If text search is unavailable, call `POST /api/v2/maintenance/rebuild-index`
        to rebuild indexes manually.
      operationId: searchRecords
      tags:
        - Search
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchPageRequest"
      responses:
        "200":
          description: Score-ranked page of results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchPageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v2/autocomplete:
    get:
      summary: IQL autocomplete
      description: Returns completion suggestions for an IQL prefix.
      operationId: iqlAutocomplete
      tags:
        - Search
      security:
        - bearerAuth: []
      parameters:
        - name: prefix
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Suggestion strings
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v2/audit:
    get:
      summary: Audit events
      description: Query the audit event log written when auditing is enabled.
      operationId: listAuditEvents
      tags:
        - System
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Audit log not enabled/configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v2/export:
    post:
      summary: Export records
      description: Export records to a JSONL file on the server, optionally filtered by namespace/metadata filter.
      operationId: exportRecords
      tags:
        - Records
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportRequest"
      responses:
        "200":
          description: Export completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AckResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v2/import:
    post:
      summary: Import records
      description: 'Import records inline (`records`) or from a server-side file (`path`, JSONL default or `.vdbdump` bulk via `format: "bulk"`).'
      operationId: importRecords
      tags:
        - Records
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRequest"
      responses:
        "200":
          description: Import completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AckResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v2/graph/bfs:
    post:
      summary: Breadth-first traversal
      description: BFS from root nodes following edges (optionally label-filtered).
      operationId: graphBfs
      tags:
        - Graph
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/GraphTraversalBody"
      responses:
        "200":
          $ref: "#/components/responses/GraphNodeList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v2/graph/dfs:
    post:
      summary: Depth-first traversal
      description: DFS from root nodes following edges (optionally label-filtered).
      operationId: graphDfs
      tags:
        - Graph
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/GraphTraversalBody"
      responses:
        "200":
          $ref: "#/components/responses/GraphNodeList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v2/graph/degree:
    post:
      summary: Node degree
      description: In/out degree counts for the given nodes.
      operationId: graphDegree
      tags:
        - Graph
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/GraphTraversalBody"
      responses:
        "200":
          description: Degree map per node
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v2/graph/centrality:
    post:
      summary: Centrality scores
      description: Centrality analytics over the graph (generic request/response envelope).
      operationId: graphCentrality
      tags:
        - Graph
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/GraphTraversalBody"
      responses:
        "200":
          description: Centrality scores per node
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v2/graph/pagerank:
    post:
      summary: PageRank scores
      description: PageRank analytics over the graph (generic request/response envelope).
      operationId: graphPagerank
      tags:
        - Graph
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/GraphTraversalBody"
      responses:
        "200":
          description: PageRank score per node
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v2/graph/v2/bfs:
    post:
      summary: Breadth-first traversal (v2 engine)
      description: Second-generation BFS implementation (WEB-02 extended SDK surface).
      operationId: graphV2Bfs
      tags:
        - Graph
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/GraphTraversalBody"
      responses:
        "200":
          $ref: "#/components/responses/GraphNodeList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v2/graph/v2/dfs:
    post:
      summary: Depth-first traversal (v2 engine)
      description: Second-generation DFS implementation (WEB-02 extended SDK surface).
      operationId: graphV2Dfs
      tags:
        - Graph
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/GraphTraversalBody"
      responses:
        "200":
          $ref: "#/components/responses/GraphNodeList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v2/graph/v2/degree:
    post:
      summary: Node degree (v2 engine)
      description: Second-generation degree computation (WEB-02 extended SDK surface).
      operationId: graphV2Degree
      tags:
        - Graph
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/GraphTraversalBody"
      responses:
        "200":
          description: Degree map per node
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v2/maintenance/purge:
    post:
      summary: Purge expired records
      description: Removes all expired (TTL elapsed) records. Returns the count purged.
      operationId: purgeExpired
      tags:
        - Maintenance
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Number of purged records
          content:
            application/json:
              schema:
                type: object
                required:
                  - purged
                properties:
                  purged:
                    type: integer
                    minimum: 0
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v2/maintenance/compact:
    post:
      summary: Compact storage
      description: Compacts underlying storage layers (generic acknowledgement).
      operationId: compactStorage
