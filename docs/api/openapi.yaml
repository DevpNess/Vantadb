components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Bearer token authentication. If `api_key` is configured in VantaConfig,
        all requests to `/api/*` endpoints must include this header.
        Use the environment variable `VANTADB_API_KEY` to set the key.

  schemas:
    # ── Core requests ──

    SkillWriteResult:
      description: Head version after a skill write (create/update/patch).
      type: object
      required:
        - record
        - idempotent
      properties:
        idempotent:
          type: boolean
          description: True when the write was a no-op (content hash already matched the head).
        record:
          type: object
          description: The skill head record after the write.
          additionalProperties: true

    QueryRequest:
      description: Payload for executing an IQL query.
      type: object
      required:
        - query
      properties:
        query:
          type: string
          description: IQL query string
          example: (memory:get "agent/main" "memory-1")

    RecordInput:
      description: Upsert payload mirroring the SDK `VantaMemoryInput`.
      type: object
      required:
        - namespace
        - key
        - payload
        - metadata
        - vector
        - ttl_ms
      properties:
        namespace:
          type: string
          description: Namespace to scope the record under
        key:
          type: string
          description: Unique key within the namespace
        payload:
          type: string
          description: Payload text content
        metadata:
          type: object
          description: Arbitrary metadata key-value pairs
          additionalProperties: true
        vector:
          type: array
          nullable: true
          items:
            type: number
            format: float
          description: Optional dense embedding vector
        sparse_vector:
          description: Optional sparse term-weight vector (raw-keyword weights)
          type: object
          nullable: true
          additionalProperties:
            type: number
            format: float
        ttl_ms:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          description: Time-to-live in milliseconds from now; null means never expires

    SearchPageRequest:
      description: |
        SDK hybrid-search request (`VantaMemorySearchRequest` fields flattened)
        plus offset pagination. Empty `query_vector` skips dense search;
        `text_query` drives BM25 lexical scoring.
      type: object
      required:
        - namespace
        - query_vector
        - filters
        - top_k
        - distance_metric
        - explain
      properties:
        namespace:
          type: string
        query_vector:
          type: array
          items:
            type: number
            format: float
          description: Dense query vector; empty skips dense search
        query_sparse:
          description: Optional sparse query vector for sparse-dot similarity
          type: object
          nullable: true
          additionalProperties:
            type: number
            format: float
        filters:
          type: object
          description: Metadata key-value filters
          additionalProperties: true
        text_query:
          type: string
          nullable: true
          description: Text query for BM25 lexical search
        top_k:
          type: integer
          minimum: 1
          default: 10
        distance_metric:
          type: string
          enum: [Cosine, Euclidean, Dot]
          default: Cosine
        explain:
          type: boolean
          default: false
          description: Include a `VantaSearchExplanation` per result
        exclude_superseded:
          type: boolean
          default: false
          description: Drop superseded records (ADR-028) from results
        search_profile:
          description: Optional search profile (mode, RRF k, candidate budget); null uses core defaults
          type: object
          nullable: true
          additionalProperties: true
        cursor:
          type: integer
          minimum: 0
          description: Zero-based offset into the ranked result set (server-side pagination)
        limit:
          type: integer
          minimum: 1
          description: Page size; defaults to `top_k`

    ExportRequest:
      description: Body for `POST /api/v2/export`.
      type: object
      required:
        - path
      properties:
        path:
          type: string
          description: Target path for the export file (JSONL)
        namespace:
          type: string
          nullable: true
          description: When present, exports only this namespace
        filter:
          description: Optional AND-combined metadata filter applied to exported records
          type: array
          nullable: true
          items:
            type: object
            additionalProperties: true

    ImportRequest:
      description: Body for `POST /api/v2/import`. `records` and `path` are mutually exclusive.
      type: object
      properties:
        records:
          type: array
          nullable: true
          description: Inline records to import (export wire format)
          items:
            type: object
            additionalProperties: true
        path:
          type: string
          nullable: true
          description: Path to a JSONL export or `.vdbdump` bulk file
        format:
          type: string
          nullable: true
          enum: [jsonl, bulk]
          description: File format when `path` is set; default jsonl

    # ── Generic envelopes ──

    AckResponse:
      description: Generic success envelope returned by write endpoints.
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
        error:
          type: string
          nullable: true
        data:
          description: Endpoint-specific payload (count, id, etc.)
          nullable: true

    RecordEnvelope:
      description: Single-record response envelope (`{success, data|error}`).
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
        error:
          type: string
          nullable: true
        data:
          description: Record wire shape (namespace/key/payload/metadata/vector/ttl)
          type: object
          nullable: true
          additionalProperties: true

    ListPageResponse:
      description: Cursor-paginated record list.
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
        error:
          type: string
          nullable: true
        records:
          type: array
          items:
            type: object
            additionalProperties: true
        next_cursor:
          type: string
          nullable: true

    SearchPageResponse:
      description: Offset-paginated search results mirroring `VantaMemoryListPage`.
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
        error:
          type: string
          nullable: true
        records:
          type: array
          items:
            type: object
            additionalProperties: true
        next_cursor:
          type: string
          nullable: true

    # ── Responses ──

    HealthResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          description: Always true when the server is healthy
          example: true
        data:
          type: string
          description: Status message
          example: "OK"

    QueryResponse:
      description: Response from an IQL query execution.
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          description: Whether the query succeeded
        data:
          type: string
          description: Human-readable result summary
        node_id:
          type: integer
          nullable: true
          minimum: 0
          description: |
            ID of the affected node (write operations) or stale summary ID.
            Null for read operations returning multiple nodes.
        nodes:
          type: array
          nullable: true
          description: |
            Returned nodes (present only for read operations that matched nodes).
            Null for write operations.
          items:
            $ref: "#/components/schemas/NodeDTO"
      examples:
        - summary: Read response
          value:
            success: true
            data: "Read 1 nodes."
            node_id: null
            nodes:
              - id: "1"
                fields:
                  key: memory-1
                  namespace: agent/main
                vector: null
                vector_dimensions: 0
                edges: []
                confidence_score: 0.95
                importance: 0.5
                hits: 3
                last_accessed: 1700000000000
                epoch: 1
                tier: Hot
                is_alive: true
        - summary: Write response
          value:
            success: true
            data: "Mutated 1 nodes: inserted"
            node_id: 42
            nodes: null
        - summary: Error response
          value:
            success: false
            data: "Execution Error: node not found: 999"
            node_id: null
            nodes: null

    # ── DTOs ──

    NodeDTO:
      description: A single node returned from a read query, matching VantaNodeRecord.
      type: object
      required:
        - id
        - fields
        - vector_dimensions
        - edges
        - confidence_score
        - importance
        - hits
        - last_accessed
        - epoch
        - tier
        - is_alive
      properties:
        id:
          type: string
          description: Unique node identifier (u128 serialized as string)
        fields:
          type: object
          description: Structured field key-value map
          additionalProperties:
            $ref: "#/components/schemas/FieldValue"
        vector:
          type: array
          nullable: true
          items:
            type: number
            format: float
          description: Optional embedding vector
        vector_dimensions:
          type: integer
          minimum: 0
          description: Dimension count of the vector (0 if no vector)
        edges:
          type: array
          items:
            $ref: "#/components/schemas/EdgeDTO"
          description: Outgoing graph edges
        confidence_score:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          description: Telemetry confidence score (0.0–1.0)
        importance:
          type: number
          format: float
          description: Telemetry importance score
        hits:
          type: integer
          minimum: 0
          description: Number of access hits recorded
        last_accessed:
          type: integer
          minimum: 0
          description: Unix-ms timestamp of last access
        epoch:
          type: integer
          minimum: 0
          description: Telemetry epoch counter
        tier:
          type: string
          enum: [Hot, Cold]
          description: Storage tier
        is_alive:
          type: boolean
          description: Whether the node is alive (not tombstoned)
    EdgeDTO:
      description: A weighted directed edge to a target node.
      type: object
      required:
        - target
        - label
        - weight
      properties:
        target:
          type: string
          description: Target node id (u128 serialized as string)
        label:
          type: string
          description: Edge label describing the relationship
        weight:
          type: number
          format: float
          description: Edge weight for weighted graph algorithms

    FieldValue:
      oneOf:
        - type: string
          description: String field value
        - type: integer
          description: Integer field value
        - type: number
          format: float
          description: Float field value
        - type: boolean
          description: Boolean field value
        - type: array
          description: Array field value
          items: {}
        - type: "null"
          description: Null field value

    # ── Error schemas ──

    ErrorResponse:
      description: Standard error response body.
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          enum: [false]
          description: Always false for errors
        error:
          type: string
          description: Human-readable error message
        hint:
          type: string
          description: Optional guidance for resolving the error
          example: "Provide a valid Bearer token in the Authorization header."

    ValidationError:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            field:
              type: string
              description: The field that failed validation
            reason:
              type: string
              description: Why the field is invalid

    # ── Rate limiting ──

    RateLimitResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          properties:
            retry_after:
              type: integer
              description: Seconds to wait before retrying (also set in Retry-After header)

  # ── Request bodies ──

  requestBodies:
    GraphTraversalBody:
      description: |
        Graph traversal request: root node IDs (start), traversal mode (bfs/dfs),
        max depth, edge direction, and optional label/time filters.
        Matches the MCP `graph_traverse` handler and SDK `graph_bfs`/`graph_dfs` methods.
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - start
              - mode
              - max_depth
              - direction
            properties:
              start:
                type: array
                items:
                  type: string
                  pattern: '^[0-9]+$'
                description: Root node IDs (u128) to start traversal from
              mode:
                type: string
                enum: [bfs, dfs]
                description: Traversal algorithm — breadth-first or depth-first
              max_depth:
                type: integer
                minimum: 1
                description: Maximum traversal depth (inclusive)
              direction:
                type: string
                enum: [outgoing, incoming, both]
                description: Edge direction to follow
              filter:
                type: object
                nullable: true
                description: Optional label and time-range filter
                properties:
                  labels:
                    type: array
                    items:
                      type: integer
                      minimum: 0
                    description: Edge label IDs to include (empty = all labels)
                  time_range:
                    type: array
                    nullable: true
                    minItems: 2
                    maxItems: 2
                    items:
                      type: integer
                      minimum: 0
                    description: Optional [from_ms, to_ms] Unix-millisecond time range filter

  # ── Reusable responses ──

  responses:
    GraphNodeList:
      description: Traversed nodes in visit order
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "#/components/schemas/NodeDTO"

    BadRequest:
      description: Invalid request (parse error, malformed query, etc.)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error: "IQL parse error at line 1, col 15: unexpected token"

    Unauthorized:
      description: Missing or invalid authentication token
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Bearer realm
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error: "Unauthorized"
            hint: "Provide a valid Bearer token in the Authorization header."

    Forbidden:
      description: Token authenticated but insufficient RBAC permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error: "Forbidden: insufficient permissions for this operation"

    NotFound:
      description: Referenced resource (node, namespace, etc.) not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error: "node not found: 999"

    Conflict:
      description: Optimistic-lock conflict (stale expected_version) or duplicate resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error: "execution conflict on skill:skl-1 — expected version 1, head is 3"

    TooManyRequests:
      description: Rate limit exceeded (configurable via rate_limit_rpm, default 100 req/min)
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RateLimitResponse"
          example:
            success: false
            error: "Too many requests. Rate limit: 100 requests per minute."

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            success: false
            error: "Internal server error: execution task panicked: ..."

  # ── Parameters ──

  parameters:
    NamespacePath:
      name: ns
      in: path
      required: true
      description: Record namespace
      schema:
        type: string
    KeyPath:
      name: key
      in: path
      required: true
      description: Record key within the namespace
      schema:
        type: string
    ThreadIdPath:
      name: id
      in: path
      required: true
      description: Thread identifier
      schema:
        type: string
    SkillIdPath:
      name: skill_id
      in: path
      required: true
      description: Skill identifier (e.g. `skl-…`), immutable across versions
      schema:
        type: string
    SkillOwnerQuery:
      name: owner_agent
      in: query
      required: true
      description: >-
        Owning agent identifier. A mismatch with the skill's owner returns the
        same 404 as a missing skill (anti-enumeration).
      schema:
        type: string
    SkillExpectedVersionQuery:
      name: expected_version
      in: query
      required: true
      description: Current head version (optimistic lock); a stale value returns 409.
      schema:
        type: integer
    AuthorizationHeader:
      name: Authorization
      in: header
      required: true
      description: Bearer token for authentication
      schema:
        type: string
        pattern: "^Bearer .+$"
        example: "Bearer <your-api-key>"
