      operationId: createSkill
      tags:
        - Skills
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - content
                - owner_agent
              properties:
                name:
                  type: string
                description:
                  type: string
