[package]
name = "vanta-proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Transparent LLM wire proxy (OpenAI Chat / Anthropic Messages / Responses API)"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
toml = "0.9"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Stream draining for the MEM-51 SSE interceptor (already in the graph via
# reqwest/axum — promoted to a real dep, no new crates introduced).
futures = "0.3"
# Workspace deps for the MEM-26 cycle: local RBAC entity_* auth (D25/D34) and
# persona/scene injection via the memory lib (D29). Graph stays acyclic:
# proxy → {memory, vantadb}.
vantadb = { path = "..", default-features = false, version = "0.5.0" }
vanta-memory = { path = "../vanta-memory", default-features = false, version = "0.5.0" }

[dev-dependencies]
futures = "0.3"

[lints]
workspace = true
