# =============================================================================
# Profile: vantadb
# =============================================================================
# VantaDB-specific review/audit profile. Inherits `default` and adds:
#   - Concrete Cargo workspace commands (cargo nextest --profile audit, etc.)
#   - Python / WASM / TypeScript SDK paths (vantadb-python/, vantadb-wasm/, vantadb-ts/)
#   - Next.js web frontend at web/
#   - GitHub Actions CI parity check
#   - Codegraph integration at L0 (.codegraph/)
#   - Full ISO 25010 + SonarQube + CII + OWASP + CodeClimate scoring
#   - 12-category taxonomy with VantaDB-specific subcategories
#   - PowerShell pre-push hook generator
#   - Custom subagent types: vanta-worker, vanta-audit, vanta-tuner, vanta-docs,
#     vanta-arch, vanta-lead
#
# Replaces (with 1:1 or superior capability):
#   - vantadb-full-review  -> /review full      --profile vantadb
#   - vantadb-certify      -> /review certify   --profile vantadb
#   - vantadb-audit        -> /audit (alias) or /review <mode> --profile vantadb
#
# Requires these custom subagent definitions in .opencode/agents/ or opencode.json:
#   vanta-worker, vanta-audit, vanta-tuner, vanta-docs, vanta-arch, vanta-lead
# Falls back to `general` (built-in) if a custom type is missing.
# =============================================================================

profile:
  name: vantadb
  description: >
    VantaDB review/audit profile. Inherits the generic default profile and
    adds Rust workspace commands, Python/WASM/TS SDK paths, Next.js frontend,
    GitHub Actions CI parity, codegraph integration, full ISO 25010 +
    SonarQube + CII + OWASP + CodeClimate scoring, and PowerShell pre-push
    hook generator. Uses VantaDB-specific subagent types (vanta-worker,
    vanta-audit, vanta-tuner, vanta-docs, vanta-arch, vanta-lead).
  inherits: default

# -----------------------------------------------------------------------------
# Project metadata (VantaDB is known, so we pin it)
# -----------------------------------------------------------------------------

project:
  type: monorepo
  languages:
    - rust
    - python
    - typescript
  bindings:
    - python       # via maturin + PyO3
    - wasm         # via wasm-pack
    - typescript   # standalone SDK at vantadb-ts/
  web_framework: next
  ci_system: github-actions

# -----------------------------------------------------------------------------
# Phase overrides (merged by id with default.yml)
# -----------------------------------------------------------------------------
# Only the fields that differ from default are listed. Fields not listed
# inherit from default.yml unchanged.
# -----------------------------------------------------------------------------

phases:
  # =========================================================================
  # L0 — Diff Impact Analysis (uses codegraph)
  # =========================================================================
  - id: L0
    name: "Diff Impact Analysis (Codegraph)"
    description: >
      Use codegraph_explore to identify modules and tests affected by the
      staged diff. Scale up review if diff touches sensitive paths
      (workflows, configs, unsafe blocks). VantaDB-specific escalation rules.
    critical: false
    parallel: false
    subagent_type: ~
    detect:
      - always
    commands:
      codegraph:
        - "codegraph_explore \"affected modules by $(git diff --name-only HEAD)\""
        - "codegraph_explore dependencies --affected"
      git:
        - "git status --short"
        - "git diff --name-only HEAD"
        - "git log --oneline -10"
    escalation_rules:
      - trigger: "diff touches .github/workflows/*.yml"
        action: "escalate L4 to vanta-lead and require CI parity check"
      - trigger: "diff touches any Cargo.toml"
        action: "escalate L4 CI parity check"
      - trigger: "diff introduces new unsafe blocks"
        action: "escalate L1 to add Miri run + L7 to add unsafe review"
      - trigger: "diff touches crates/vantadb-server/"
        action: "escalate L8 to add binary size check"
    timeout_ms: 15000
    score_max: ~

  # =========================================================================
  # L1 — Rust Workspace Check (CRITICAL — uses nextest profile)
  # =========================================================================
  - id: L1
    name: "Rust Workspace Check"
    description: >
      Compile, lint, and test the entire VantaDB Cargo workspace.
      Uses cargo nextest with the `audit` profile and parallel build jobs=2
      to match CI exactly. Critical phase: aborts pipeline on any failure.
      If diff introduces unsafe, also run Miri.
    critical: true
    parallel: true
    subagent_type: vanta-worker
    detect:
      - any_language_detected
    commands:
      rust:
        # Mechanical checks (must all pass)
        - "cargo fmt --all -- --check"
        - "cargo check --workspace --tests -j 2"
        - "cargo clippy --workspace --tests -j 2 -- -D warnings"
        - "cargo audit --ignore RUSTSEC-2026-0176 --ignore RUSTSEC-2026-0177"
        - "cargo deny check"
        - "cargo semver-checks check --workspace"
        - "cargo nextest run --profile audit --workspace --build-jobs 2"
        - "cargo machete"
        - "pwsh dev-tools/scripts/check_cli.ps1"
      rust_unsafe_diff:  # only if diff introduces new unsafe blocks
        - "cargo +nightly miri test  # if nightly available"
    skills_to_load: []
    timeout_ms: 900000   # 15 min — large workspace
    score_max: 10
    quality_gates:
      - "cargo fmt --check passes (no diff)"
      - "cargo check --workspace --tests exits 0"
      - "cargo clippy -- -D warnings exits 0 (zero warnings)"
      - "cargo audit reports 0 active advisories (ignores pinned RUSTSEC-2026-0176/0177)"
      - "cargo deny check passes (licenses, bans, sources)"
      - "cargo nextest run --profile audit passes (0 failed)"
      - "cargo machete reports 0 unused dependencies"
      - "CLI compiles (check_cli.ps1 passes)"
      - "If unsafe introduced: Miri passes"

  # =========================================================================
  # L2 — Bindings: Python + WASM + TypeScript SDK
  # =========================================================================
  - id: L2
    name: "Bindings Check (Python + WASM + TS)"
    description: >
      Build and test all three VantaDB SDK bindings in parallel sub-tasks
      within this sub-agent. Each binding has its own validate script.
    critical: false
    parallel: true
    subagent_type: vanta-worker
    detect:
      - bindings_detected
    commands:
      python_maturin:
        # Python SDK at vantadb-python/
        - "pwsh dev-tools/setup_venv.ps1"
        - "pwsh dev-tools/scripts/validate_python_sdk.ps1"
        - "cd vantadb-python && python -m pytest tests/"
      wasm_pack:
        # WASM bindings at vantadb-wasm/
        - "cd vantadb-wasm && wasm-pack build --release"
        - "cd vantadb-wasm && wasm-pack test --headless"
      typescript_sdk:
        # TypeScript SDK at vantadb-ts/
        - "cd vantadb-ts && npm ci --ignore-scripts"
        - "cd vantadb-ts && npx tsc --noEmit"
        - "cd vantadb-ts && npm test"
    skills_to_load:
      - doubt-driven-development  # for adapter tests verification
    timeout_ms: 600000
    score_max: 10
    quality_gates:
      - "Python SDK builds via maturin"
      - "Python integration tests pass (validate_python_sdk.ps1)"
      - "WASM bindings build with wasm-pack --release"
      - "WASM tests pass (headless)"
      - "TypeScript SDK compiles (tsc --noEmit)"
      - "TypeScript SDK tests pass"

  # =========================================================================
  # L3 — Web Frontend (Next.js at web/)
  # =========================================================================
  - id: L3
    name: "Web Frontend Check (Next.js)"
    description: >
      Lint, type-check, and build the Next.js app at web/. Matches the
      ci-web-11.yml workflow exactly.
    critical: false
    parallel: true
    subagent_type: vanta-worker
    detect:
      - web_framework_detected
    commands:
      next:
        - "cd web && npm ci --ignore-scripts"
        - "cd web && npm run lint"
        - "cd web && npx tsc --noEmit"
        - "cd web && npm run build"
    skills_to_load:
      - frontend-ui-engineering
      - platform-design
    timeout_ms: 600000
    score_max: 10
    quality_gates:
      - "npm run lint: 0 errors, 0 warnings"
      - "npx tsc --noEmit: 0 errors"
      - "npm run build: next build exits 0"
      - "Bundle size within budget (per web/budget.json)"

  # =========================================================================
  # L4 — CI/CD + Dependencies + Parity Check (escalated to vanta-lead)
  # =========================================================================
  - id: L4
    name: "CI/CD Parity + Dependencies Check"
    description: >
      Validate GitHub Actions workflows AND verify CI/CD parity: every new
      dependency in Cargo.toml/package.json/pyproject.toml must have a
      corresponding install step in .github/workflows/*.yml. Uses vanta-lead
      subagent for lead-level review authority.
    critical: false
    parallel: true
    subagent_type: vanta-lead
    detect:
      - ci_system_detected
    commands:
      github_actions:
        - "actionlint .github/workflows/*.yml  # if installed"
        - "cargo deny check"
        - "cargo audit"
        - "cd web && npm audit --audit-level=moderate"
      parity_check:
        # For each file in diff:
        - "if Cargo.toml changed -> verify .github/workflows/ci-rust-*.yml has cargo install/cache step for new deps"
        - "if package.json changed -> verify .github/workflows/ci-web-*.yml has npm ci step"
        - "if pyproject.toml changed -> verify .github/workflows/release-wheels-*.yml has pip install step"
        - "if .env or secrets changed -> verify all new env vars are in workflows or documented as secrets"
        - "if Cargo.toml version bumped -> verify release-plz.toml and release-wheels-*.yml match"
    skills_to_load:
      - ci-cd-and-automation
    timeout_ms: 300000
    score_max: 10
    quality_gates:
      - "All workflow YAML files parse and pass actionlint"
      - "CI/CD parity: every new dep has install step in CI"
      - "No new env vars without workflow injection or secret documentation"
      - "Version bumps are consistent across Cargo.toml, release-plz.toml, workflows"
      - "No new vulnerable dependencies (cargo audit + npm audit clean)"

  # =========================================================================
  # L5 — Documentation (uses vanta-docs subagent)
  # =========================================================================
  - id: L5
    name: "Documentation Coverage Check"
    description: >
      Run VantaDB's docs validation script. Verify every public Rust API
      has rustdoc, every Python binding has docstring, every CLI command
      has help text, and docs/ has no broken references.
    critical: false
    parallel: true
    subagent_type: vanta-docs
    detect:
      - docs_detected
    commands:
      rust:
        - "cargo doc --no-deps --document-private-items --workspace 2>&1 | grep -E '^warning' || echo 'no warnings'"
        - "cargo test --doc --workspace"
      validate:
        - "pwsh scripts/validate-docs-coverage.ps1"
      markdown:
        - "markdownlint-cli2 docs/**/*.md  # if installed"
        - "lychee docs/ README.md  # broken link check, if installed"
    skills_to_load:
      - documentation-and-adrs
      - writing-guidelines
    timeout_ms: 300000
    score_max: 10
    quality_gates:
      - "validate-docs-coverage.ps1 exits 0"
      - "No rustdoc warnings on workspace"
      - "All doctests pass"
      - "No broken links in docs/ and README.md"
      - "Every pub fn has a doc comment (enforced by clippy::missing_docs_in_private_items)"

  # =========================================================================
  # L6 — Architecture Review (uses vanta-arch + codegraph)
  # =========================================================================
  - id: L6
    name: "Architecture Review (Codegraph)"
    description: >
      Structural analysis using codegraph. Verify WAL/HNSW layer boundaries,
      no leakage between crates, no circular dependencies, no god modules.
      VantaDB-specific architectural invariants.
    critical: false
    parallel: true
    subagent_type: vanta-arch
    detect:
      - any_language_detected
    commands:
      codegraph:
        - "codegraph_explore dependencies --workspace"
        - "codegraph_explore layering --validate-invariants"
        - "codegraph_explore \"god modules (>1000 lines or >30 pub exports)\""
      manual:
        - "verify WAL layer doesn't depend on HNSW layer"
        - "verify crates/vantadb-server doesn't import crates/vantadb-core internals (only pub API)"
        - "verify no crate imports more than 5 other workspace crates (coupling budget)"
    skills_to_load:
      - code-review-and-quality
      - api-and-interface-design
      # ponytail-audit loaded conditionally by orchestrator in full/ultra mode
    timeout_ms: 300000
    score_max: 10
    quality_gates:
      - "No new circular dependencies"
      - "No new layering violations (WAL/HNSW/server boundaries)"
      - "No new god modules"
      - "No crate exceeds coupling budget of 5 workspace deps"
      - "No new premature abstractions ( Ponytail audit if mode=full/ultra )"

  # =========================================================================
  # L7 — Security Audit (uses vanta-audit subagent, OWASP ASVS)
  # =========================================================================
  - id: L7
    name: "Security Audit (OWASP ASVS)"
    description: >
      Full security audit: cargo audit + cargo deny + OWASP ASVS L1/L2
      checklist + unsafe block review + input validation review + auth/authz
      review (for server crate). Uses vanta-audit subagent.
    critical: false
    parallel: true
    subagent_type: vanta-audit
    detect:
      - mode_is_full
    commands:
      rust:
        - "cargo audit"
        - "cargo deny check advisories"
        - "cargo deny check bans"
      unsafe_review:
        - "grep -rn 'unsafe' crates/ --include='*.rs' | grep -v '// SAFETY:'"
        - "for each unsafe block without SAFETY comment -> finding (critical)"
      owasp_asvs:
        - "V1 Architecture: review trust boundaries"
        - "V2 Authentication: verify password hashing, session management"
        - "V3 Session Management: verify session timeout, invalidation"
        - "V4 Access Control: verify authz on every endpoint"
        - "V5 Validation: verify input validation on every external input"
        - "V7 Error Handling: verify no sensitive info in errors"
        - "V8 Data Protection: verify encryption at rest/in transit"
        - "V9 Communications: verify TLS, no mixed content"
        - "V12 Files: verify path traversal protection"
    skills_to_load:
      - security-and-hardening
    timeout_ms: 600000
    score_max: 10
    quality_gates:
      - "cargo audit: 0 active advisories"
      - "cargo deny check: passes"
      - "0 unsafe blocks without SAFETY comment"
      - "OWASP ASVS L1: 100% pass"
      - "OWASP ASVS L2: >= 80% pass (target for next release)"

  # =========================================================================
  # L8 — Performance Audit (uses vanta-tuner subagent)
  # =========================================================================
  - id: L8
    name: "Performance Audit"
    description: >
      Run VantaDB benchmarks, check binary size of vantadb-server, profile
      hot paths (WAL writes, HNSW queries). Uses vanta-tuner subagent.
    critical: false
    parallel: true
    subagent_type: vanta-tuner
    detect:
      - mode_is_full
    commands:
      rust:
        - "cargo bench --workspace 2>&1 | tee docs/reviews/bench-<timestamp>.log"
        - "cargo bloat --release --crates -p vantadb-server 2>&1 | tee docs/reviews/bloat-<timestamp>.log"
      targets:
        - "vantadb-server binary size < 1.5 MB (target)"
        - "WAL write throughput >= baseline"
        - "HNSW query p99 latency < 10ms (target)"
    skills_to_load:
      - performance-optimization
    timeout_ms: 900000   # benchmarks can be slow
    score_max: 10
    quality_gates:
      - "No benchmark regression > 10% vs main branch"
      - "vantadb-server binary size <= 1.5 MB"
      - "WAL write throughput within 10% of baseline"
      - "HNSW query p99 latency < 10ms"
      - "No new allocations in hot path (manual review of diff)"

  # =========================================================================
  # L9 — Code Review (cognitive, multi-skill, can veto)
  # =========================================================================
  - id: L9
    name: "Code Review (Multi-Skill)"
    description: >
      Multi-skill cognitive review. Each skill can VETO (record objection,
      pipeline continues). Order matters: code-review-and-quality first
      (baseline), then adversarial (doubt-driven), then simplification,
      then security, then deprecation. Ponytail-aware.
    critical: false
    parallel: true
    subagent_type: vanta-audit
    detect:
      - mode_is_review_or_full
    commands:
      generic:
        - "review staged diff (git diff) file by file"
        - "for each file, apply skills in order; collect findings + vetoes"
    skills_to_load:
      - code-review-and-quality      # baseline 5-axis review
      - doubt-driven-development     # adversarial for high-stakes changes
      - code-simplification          # detect unnecessary complexity
      - security-and-hardening       # input validation, trust boundaries
      - deprecation-and-migration    # only if public API changed
      - systematic-debugging         # only if known issues exist
      # ponytail-review loaded conditionally by orchestrator in full/ultra mode
    veto_policy:
      record_only: true              # veto recorded, pipeline continues
      escalate_if_vetoes_ge: 3       # if 3+ vetoes, mark overall Quality Gate as FAIL
    timeout_ms: 900000
    score_max: 10
    quality_gates:
      - "No unaddressed critical findings"
      - "Veto count < 3"
      - "Every public API change has migration note"

# -----------------------------------------------------------------------------
# Modes — VantaDB uses the same 4 modes as default but with VantaDB phases
# -----------------------------------------------------------------------------

modes:
  quick:
    - L0
    - L1
  certify:
    - L0
    - L1
    - L2
    - L3
    - L4
    - L5
    - L6
  review:
    - L0
    - L1
    - L6
    - L9
  full:
    - L0
    - L1
    - L2
    - L3
    - L4
    - L5
    - L6
    - L7
    - L8
    - L9

# -----------------------------------------------------------------------------
# Scoring (FULL — ISO 25010 + SonarQube + CII + OWASP + CodeClimate)
# -----------------------------------------------------------------------------
# Same weights as legacy vantadb-full-review.
# -----------------------------------------------------------------------------

scoring:
  enabled: true
  weights:
    iso_25010: 20        # 8 characteristics scored 0-10
    sonarqube: 25        # 9 Quality Gate conditions
    cii: 20              # None / Passing / Silver / Gold
    owasp: 15            # L1 / L2 / L3
    codeclimate: 20      # A / B / C / D / E maintainability
  thresholds:
    pass_score: 7
    rating_bands:
      A: 9
      B: 7
      C: 5
      D: 3
      E: 0
  iso_25010_mapping:
    functional_suitability: [L1, L2, L4]   # API contract testing
    reliability: [L1, L8]                  # WAL, HNSW maturity
    performance_efficiency: [L1, L8]       # benchmarks, bundle size
    compatibility: [L2, L3]                # SDK interop, web
    usability: [L3]                        # Next.js UX
    security: [L1, L7]                     # unsafe, OWASP
    maintainability: [L6]                  # architecture
    portability: [L4]                      # Docker, WASM
  sonarqube_quality_gates:
    - "No new reliability issues"
    - "No new security issues"
    - "No new maintainability issues"
    - "Coverage >= 80% on new code"
    - "Duplication <= 3% on new code"
    - "All hotspots reviewed"
    - "No leaked credentials"
    - "Vulnerabilities fixed < 60 days"
    - "No new blocker issues"
  cii_levels:
    current: "Passing"
    target: "Silver"
    gaps_for_silver:
      - "Add license SPDX tag in Cargo.toml"
      - "Document vulnerability response policy in SECURITY.md"
      - "Add human-readable description in README"
  owasp_asvs_target: "L1"
  codeclimate_rating:
    target: "A"
    current_estimate: "B"

# -----------------------------------------------------------------------------
# Findings Taxonomy — VantaDB extensions (merged with default)
# -----------------------------------------------------------------------------
# The 12 canonical categories stay. We add VantaDB-specific subcategories
# to ARCH, PATTERN, MISSING.
# -----------------------------------------------------------------------------

findings:
  categories:
    - id: LOGIC
      name: "Logic failures"
      subcategories:
        - "Off-by-one"
        - "Race condition"
        - "Incorrect branching"
        - "State management"
        - "Edge case not handled"
        - "Input validation"
        - "Error handling"
        - "Type confusion"
        - "Incorrect serialization"
        - "Async/sync mismatch"

    - id: PATTERN
      name: "Pattern failures"
      subcategories:
        - "GoF pattern violation"
        - "Rust anti-pattern (clone everywhere, Rc<RefCell> instead of Arc<Mutex>, unnecessary unsafe)"
        - "Python anti-pattern (mutable default args, missing type hints)"
        - "JS/TS anti-pattern (any everywhere, null vs undefined inconsistent)"
        - "React anti-pattern (useEffect without deps, key incorrect, direct DOM mutation)"
        - "API design anti-pattern"
        - "Database anti-pattern (N+1 queries, missing indexes)"
        - "Adapter pattern mal applied"

    - id: ARCH
      name: "Architecture failures"
      subcategories:
        - "Circular dependencies"
        - "Layering violation (WAL/HNSW/server boundaries)"
        - "God object / God module (>1000 lines or >30 pub exports)"
        - "Feature leakage"
        - "Tight coupling (crate imports > 5 workspace deps)"
        - "Missing abstraction"
        - "Premature abstraction"
        - "Leaky abstraction"
        - "Incorrect module boundary"
        - "VantaDB-specific: WAL layer depends on HNSW layer"
        - "VantaDB-specific: server crate imports core internals (not pub API)"

    - id: DIRECTION
      name: "Project direction failures"
      subcategories:
        - "Scope creep (feature not in docs/Backlog.md or docs/VantaDB-MPTS/)"
        - "Abandoned effort (commit with WIP/wip/draft)"
        - "Tech debt not prioritized"
        - "Strategic misalignment"
        - "Missing validation"
        - "Over-engineering"
        - "Under-engineering"
        - "Missing roadmap"

    - id: CLARITY
      name: "Clarity failures"
      subcategories:
        - "Naming confusing"
        - "Magic numbers/strings"
        - "Logic too nested (>3 levels, >10 lines per function)"
        - "Missing comments (unsafe without SAFETY docs)"
        - "Dead code"
        - "Test incomprehensible"
        - "Doc outdated"
        - "Error message confusing"
        - "Config hidden (hardcoded values that should be configurable)"
        - "Formatting inconsistent"

    - id: CODE
      name: "Code quality failures"
      subcategories:
        - "Compiler warnings"
        - "Clippy lints not fixed"
        - "Lint suppressions without justification (#[allow()] without comment)"
        - "Unsafe without SAFETY comment"
        - "Unnecessary clone (in hot path or on Copy types)"
        - "Unnecessary allocation (Box/Arc/String where not needed)"
        - "Casting incorrect (as casts, transmute)"
        - "TOCTOU bugs"
        - "Error swallowing (let _ =, .ok(), .ignore())"
        - "Panic in library code (panic!() in non-binary crate)"

    - id: DESIGN
      name: "Design / UX failures"
      subcategories:
        - "Visual inconsistency"
        - "Accessibility (contrast, focus, aria)"
        - "Responsive broken"
        - "Motion excessive (no prefers-reduced-motion)"
        - "AI slop"
        - "Touch targets (< 44px)"
        - "Loading states (no skeleton/spinner)"
        - "Empty states"
        - "Error states (raw JSON/stack trace shown to user)"

    - id: ERROR
      name: "Concrete errors"
      subcategories:
        - "Compilation error"
        - "Test failure"
        - "Flaky test"
        - "Build warning as error (-D warnings)"
        - "Runtime panic"
        - "Deadlock"
        - "Memory leak (Arc cycles, forgot drop, global state)"
        - "CI failure"
        - "Security vulnerability"
        - "Dependency conflict"

    - id: MISSING
      name: "Missing elements"
      subcategories:
        - "Missing test"
        - "Missing validation"
        - "Missing error handling"
        - "Missing docs (pub fn without docstring)"
        - "Missing CI gate"
        - "Missing monitoring"
        - "Missing recovery (WAL replay, retry on transient failures)"
        - "Missing migration (schema change without migration path)"
        - "Missing env config (.env.example outdated or missing)"
        - "VantaDB-specific: WAL operation without recovery test"
        - "VantaDB-specific: HNSW index operation without persistence test"

    - id: FEATURE
      name: "Missing features"
      subcategories:
        - "Feature gap vs competitor (Chroma/Pinecone/Milvus)"
        - "Missing integration (adapter faltante: LangChain listo pero no LlamaIndex)"
        - "Missing platform support"
        - "Missing observability feature"

    - id: ALGO
      name: "Algorithmic failures"
      subcategories:
        - "Wrong complexity (O(n²) where O(n log n) possible)"
        - "Incorrect data structure choice"
        - "Numerical instability"
        - "Algorithm off-by-one"
        - "VantaDB-specific: HNSW search with suboptimal ef parameter"
        - "VantaDB-specific: WAL with suboptimal batch size"

    - id: ANY
      name: "Catch-all (manual review)"
      subcategories:
        - "Uncategorized"

# -----------------------------------------------------------------------------
# Orchestration tuning (VantaDB is large — bump parallelism)
# -----------------------------------------------------------------------------

orchestration:
  max_parallel: 4                  # keep at 4 — orchestrator context budget
  timeout_ms: 600000               # 10 min default for VantaDB-sized phases
  abort_on_critical_fail: true
  retry_mechanical: true
  keep_raw_logs: true              # VantaDB wants raw logs for audit trail
  raw_logs_dir: "docs/reviews/logs"

# -----------------------------------------------------------------------------
# Report format (VantaDB writes BOTH .md and .html — HTML for sharing with
# stakeholders, MD for git diffs and code review comments)
# -----------------------------------------------------------------------------

report:
  format: both                     # markdown | html | both
  markdown_template: ~             # built-in
  html_template: "templates/report.html.tmpl"
  output_dir: "docs/reviews"
  filename_pattern: "review-<mode>-<timestamp>"

# -----------------------------------------------------------------------------
# Pre-push hook (PowerShell for VantaDB on Windows dev machines)
# -----------------------------------------------------------------------------

pre_push_hook:
  enabled: true
  platform: powershell
  template_file: "templates/pre-push.ps1.tmpl"
  # Generated hook runs the SIPP (Single Iteration Pre-Push) barrier:
  #   cargo check --workspace --all-targets
  #   cargo clippy --workspace --all-targets -- -D warnings
  #   cargo nextest run --profile audit --workspace --build-jobs 2
  # If any fails, push is blocked before OpenCode is invoked.

# -----------------------------------------------------------------------------
# Integrations
# -----------------------------------------------------------------------------

integrations:
  ponytail:
    respect_mode: true
    skip_phases_in_lite:
      - L6      # skip architecture review (Ponytail tolerates over-engineering)
    escalate_in_ultra:
      - L6      # escalate DIRECTION/Over-engineering findings
      - L9      # also escalate in cognitive review
  campaign:
    enabled: auto
    plan_file_pattern: "docs/plans/plan-review-<timestamp>.md"
  codegraph:
    use_if_available: true        # VantaDB has .codegraph/ in repo
    phase: L0                     # codegraph used at L0 impact analysis
