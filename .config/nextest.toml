[profile.default]
# Only quick integrity tests run in CI. Heavy tests are excluded here and run
# exclusively in heavy-certification-50.yml (weekly).
# Binary IDs match the test file stem (e.g. tests/storage/wal_resilience.rs → wal_resilience).
#
# BND-06 scope-safe form: every exclusion is qualified with its owning package
# (`not (package(X) and binary(Y))`). Bare `binary(Y)` is validated against the
# binaries of the selected packages, so `cargo nextest run -p <crate>` failed to
# parse this filter when a name only existed in another package. Qualified
# exclusions are no-ops outside their package and keep workspace-wide runs
# excluding exactly the same binaries.
default-filter = """\
not (package(vantadb) and binary(benchmark_internal)) \
and not (package(vantadb) and binary(benchmark_datasets)) \
and not (package(vantadb) and binary(cli_tests)) \
and not (package(vantadb) and binary(concurrency_parity)) \
and not (package(vantadb) and binary(concurrency_primitives)) \
and not (package(vantadb) and binary(derived_index_recovery)) \
and not (package(vantadb) and binary(durability_recovery)) \
and not (package(vantadb) and binary(edge_cases)) \
and not (package(vantadb) and binary(file_locking_stress)) \
and not (package(vantadb) and binary(fjall_cold_copy_restore)) \
and not (package(vantadb) and binary(fuzz_proptest)) \
and not (package(vantadb) and binary(index_reconstruction)) \
and not (package(vantadb) and binary(memory_api)) \
and not (package(vantadb) and binary(memory_brutality)) \
and not (package(vantadb) and binary(memory_export_import)) \
and not (package(vantadb) and binary(operational_metrics)) \
and not (package(vantadb) and binary(prefetch_benchmark)) \
and not (package(vantadb) and binary(property_durability)) \
and not (package(vantadb) and binary(schema_evolution)) \
and not (package(vantadb) and binary(text_index_recovery)) \
and not (package(vantadb) and binary(wal_resilience)) \
and not (package(vantadb) and binary(python_sdk_boundary)) \
and not (package(vantadb) and binary(structured_api_v2)) \
and not (package(vantadb) and binary(hnsw_recall_certification)) \
and not (package(vantadb) and binary(hnsw_validation)) \
and not (package(vantadb) and binary(hybrid_ranking_metrics)) \
and not (package(vantadb) and binary(hybrid_retrieval_quality)) \
and not (package(vantadb) and binary(sift_validation)) \
and not (package(vantadb) and binary(stress_protocol)) \
and not (package(vantadb) and binary(multi_namespace_stress)) \
and not (package(vantadb) and binary(competitive_bench)) \
and not (package(vantadb) and binary(hardware_profiles)) \
and not (package(vantadb) and binary(basic_node)) \
and not (package(vantadb) and binary(vector_scale_check)) \
and not (package(vantadb) and binary(integration)) \
and not (package(vantadb-server) and binary(mcp_integration)) \
and not (package(vantadb-server) and binary(e2e)) \
and not (package(vantadb-server) and binary(benchmarks)) \
and not (package(vantadb-server) and binary(server)) \
and not (package(vantadb) and binary(antilocality_layout)) \
and not (package(vantadb) and binary(backend_tests)) \
and not (package(vantadb) and binary(chaos_integrity)) \
and not (package(vantadb) and binary(crash_injection)) \
and not (package(vantadb) and binary(gc)) \
and not (package(vantadb) and binary(mmap_index)) \
and not (package(vantadb) and binary(multi_process_lock)) \
and not (package(vantadb) and binary(mutations)) \
and not (package(vantadb) and binary(storage)) \
and not (package(vantadb) and binary(tombstone_ann_vstore)) \
and not (package(vantadb-mcp) and binary(mcp_tests)) \
and not (package(vantadb) and binary(multilingual_tokenizer_integration)) \
and not (package(vantadb) and binary(memory_telemetry)) \
and not (package(vantadb) and binary(regression_certification)) \
and not (package(vantadb) and binary(snapshot_certification)) \
and not (package(vantadb) and binary(security_audit)) \
"""
# No global test-threads limit - let Linux/macOS use full parallelism

[profile.ci-windows]
# Windows-specific override: limit to 2 threads to avoid os error 1455 (page file)
inherits = "audit"
test-threads = 2

[profile.audit]
fail-fast = false
failure-output = "immediate-final"
success-output = "never"
status-level = "slow"
final-status-level = "slow"
slow-timeout = { period = "60s", terminate-after = 3 }
leak-timeout = { period = "500ms", result = "fail" }
[profile.audit.junit]
path = "junit.xml"
report-name = "vantadb-audit"
store-success-output = false
store-failure-output = true

[profile.experimental]
default-filter = "test(integration) or test(parser) or test(executor) or test(governor) or test(columnar) or test(mcp_integration) or test(structured_api_v2) or test(graph)"
fail-fast = false
failure-output = "immediate-final"
success-output = "never"
status-level = "slow"
final-status-level = "slow"
slow-timeout = { period = "60s", terminate-after = 3 }
leak-timeout = { period = "500ms", result = "fail" }

[profile.chaos]
default-filter = "test(chaos_integrity_failpoints)"
fail-fast = false
failure-output = "immediate-final"
test-threads = 1
slow-timeout = { period = "30s", terminate-after = 3 }
leak-timeout = { period = "500ms", result = "fail" }

