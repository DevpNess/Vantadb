<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>VantaDB Playground Executor</title>
  <!-- WEB-07 + WEB-08: iframe sandbox executor. Runs user snippets with new Function inside sandboxed iframe (allow-scripts allow-same-origin). Isolated from parent DOM/storage/navigation. WASM JS is fetch+evaluated (let wasm_bindgen not on window) to correctly bind runtime. -->
  <style>*{margin:0;padding:0}body{font:12px monospace;background:#1a1a1a;color:#fbf9f5}</style>
</head>
<body>
  <script>
    (function () {
      var WASM_JS_URL = "/vanta-wasm/vantadb_wasm.js";
      var WASM_BINARY_URL = "/vanta-wasm/vantadb_wasm_bg.wasm";
      var wasm_bindgen = null;
      var wasmReady = false;
      var wasmLoadPromise = null;

      async function ensureWasmBindgen() {
        if (wasm_bindgen) return wasm_bindgen;
        var res = await fetch(WASM_JS_URL);
        if (!res.ok) throw new Error("WASM JS fetch failed: HTTP " + res.status);
        var text = await res.text();
        // The file declares `let wasm_bindgen = (function(exports){...})({...});`
        // Evaluate inside a Function scope and return the binding.
        var factory = new Function(text + "\n; return wasm_bindgen;");
        wasm_bindgen = factory();
        if (!wasm_bindgen || !wasm_bindgen.initSync) throw new Error("wasm_bindgen.initSync missing after eval");
        return wasm_bindgen;
      }

      function loadWasm() {
        if (wasmLoadPromise) return wasmLoadPromise;
        wasmLoadPromise = (async function () {
          if (wasmReady) return;
          var runtime = await ensureWasmBindgen();
          var res = await fetch(WASM_BINARY_URL);
          if (!res.ok) throw new Error("WASM binary fetch failed: HTTP " + res.status);
          var bytes = await res.arrayBuffer();
          runtime.initSync(bytes);
          wasmReady = true;
        })().catch(function (err) { wasmLoadPromise = null; throw err; });
        return wasmLoadPromise;
      }

      function fmtArg(arg) {
        if (typeof arg === "string") return arg;
        if (arg === null) return "null";
        if (arg === undefined) return "undefined";
        if (typeof arg === "object") { try { return JSON.stringify(arg); } catch (e) { return String(arg); } }
        return String(arg);
      }

      async function executeSnippet(code, requestId) {
        try {
          await loadWasm();
          var mod = wasm_bindgen;
          var db = new mod.VantaDB({ storage_path: "playground_data" });
          var captured = [];
          var sandboxConsole = {
            log: function () { captured.push(Array.prototype.slice.call(arguments).map(fmtArg).join(" ")); },
            warn: function () { captured.push(Array.prototype.slice.call(arguments).map(fmtArg).join(" ")); },
            error: function () { captured.push("\u2717 " + Array.prototype.slice.call(arguments).map(fmtArg).join(" ")); }
          };
          var fn = new Function("VantaDB", "db", "console", "return (async () => {\n" + code + "\n})();");
          var t0 = performance.now();
          try { await fn(mod.VantaDB, db, sandboxConsole); } catch (err) {
            captured.push("\u2717 " + (err instanceof Error ? err.message : String(err)));
          }
          var elapsedMs = performance.now() - t0;
          try { db.close(); } catch (e) {}
          var output = [
            "\u2713 VantaDB WASM engine loaded",
            "\u2713 db opened \u00b7 in-memory backend",
            ...captured,
            "",
            "\u25c6 executed in " + elapsedMs.toFixed(2) + "ms \u00b7 wasm32 (sandboxed iframe)"
          ];
          parent.postMessage({ type: "result", requestId: requestId, output: output }, "*");
        } catch (err) {
          parent.postMessage({ type: "result", requestId: requestId, output: [], error: "failed to load VantaDB WASM engine: " + (err instanceof Error ? err.message : String(err)) }, "*");
        }
      }

      window.addEventListener("message", function (event) {
        var data = event.data;
        if (!data || typeof data !== "object") return;
        if (data.type === "ping") {
          parent.postMessage({ type: "ready" }, "*");
          return;
        }
        if (data.type === "execute" && typeof data.code === "string") {
          executeSnippet(data.code, data.requestId);
        }
      });

      function postReady() {
        try { parent.postMessage({ type: "ready" }, "*"); } catch (e) {}
      }
      // Initial ready + retries to cover parent listener race
      postReady();
      setTimeout(postReady, 300);
      setTimeout(postReady, 1000);
      setTimeout(postReady, 2500);
    })();
  </script>
</body>
</html>
