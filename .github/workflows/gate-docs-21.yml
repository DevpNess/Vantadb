name: 'GATE: Docs — Lint & Frontmatter'

on:
  push:
    branches: [main]
    paths: ["docs/**", "src/cli_server.rs", "scripts/**"]
  pull_request:
    branches: [main]
    paths: ["docs/**", "src/cli_server.rs", "scripts/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Lint Markdown
        run: npx markdownlint-cli2 "docs/**/*.md"

  check-format:
    name: Check Frontmatter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check frontmatter required fields
        run: |
          PASS=true
          for f in $(find docs -name "*.md"); do
            if head -1 "$f" | grep -q "^---$"; then
              title=$(sed -n '/^---$/,/^---$/p' "$f" | grep -i "^title:" | head -1)
              if [ -z "$title" ]; then
                echo "::error file=$f::Missing frontmatter field: title"
                PASS=false
              fi
            fi
          done
          if [ "$PASS" != "true" ]; then exit 1; fi
          echo "All documents have valid frontmatter."

  check-api-version:
    name: Check API Docs Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check OpenAPI/router parity (GOV-B4)
        run: node scripts/check_openapi_parity.mjs
      - name: Check docs/api headers match workspace version
        run: |
          VER=$(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml | grep '^version' | head -1 | awk '{print $3}' | tr -d '"')
          echo "Workspace version: $VER"
          FAIL=0
          # openapi.yaml info.version (first version: line in file)
          OAPI=$(grep -m1 '^  version:' docs/api/openapi.yaml | awk '{print $2}' | tr -d '"')
          echo "openapi.yaml: $OAPI"
          if [ "$OAPI" != "$VER" ]; then
            echo "::error file=docs/api/openapi.yaml::version $OAPI != workspace $VER"
            FAIL=1
          fi
          # MCP.md implementation version (tracks workspace version; HTTP_API.md is protocol version 0.0.4 — intentionally not checked)
          MCP=$(grep -m1 'Current MCP implementation version:' docs/api/MCP.md | awk '{print $NF}')
          echo "MCP.md: $MCP"
          if [ "$MCP" != "$VER" ]; then
            echo "::error file=docs/api/MCP.md::version $MCP != workspace $VER"
            FAIL=1
          fi
          if [ "$FAIL" != "0" ]; then exit 1; fi
          echo "All tracked API doc headers match workspace version $VER."
