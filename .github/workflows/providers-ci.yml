name: Providers CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'providers/**'
      - '.github/workflows/providers-ci.yml'
  pull_request:
    paths:
      - 'providers/**'
      - '.github/workflows/providers-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check provider (${{ matrix.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        provider: [openai, litellm, ollama]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # v1
        with:
          toolchain: stable

      - name: Install maturin
        run: python -m pip install --upgrade pip maturin

      - name: Build provider
        working-directory: providers/${{ matrix.provider }}
        run: maturin develop --release

      - name: Run provider tests
        working-directory: providers/${{ matrix.provider }}
        run: |
          pip install pytest pytest-asyncio
          python -m pytest tests/ -v --tb=short

      - name: Verify .pyi matches signatures
        working-directory: providers/${{ matrix.provider }}
        run: python -c "import sys; sys.path.insert(0, '.').__class__; exec(open('.github/scripts/verify_pyi.py').read().replace('${PROVIDER}', '${{ matrix.provider }}'))"