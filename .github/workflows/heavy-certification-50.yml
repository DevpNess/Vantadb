name: 'HEAVY: Certification — All Tests'

on:
  workflow_dispatch:
    inputs:
      include_sift:
        description: "Run SIFT-1M validation (requires dataset download)"
        type: boolean
        default: false
      include_competitive:
        description: "Run competitive benchmarks"
        type: boolean
        default: false
  schedule:
    - cron: "0 3 * * 0"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  ci-gate:
    uses: ./.github/workflows/ci-gate.yml
    permissions:
      checks: read
    with:
      event_name: ${{ github.event_name }}

  stress-protocol:
    name: "Certification: stress_protocol"
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          swap-mb: 8192
          free-disk: true
      - name: Run stress protocol
        run: cargo test --release --test stress_protocol -- --nocapture --test-threads=1

  multi-namespace-stress:
    name: "Certification: multi_namespace_stress"
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
      - name: Run multi-namespace stress test
        run: cargo test --release --test multi_namespace_stress -- --nocapture --test-threads=1

  hnsw-validation:
    name: "Certification: hnsw_validation"
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          swap-mb: 8192
          free-disk: true
      - name: Run HNSW validation
        run: cargo test --release --test hnsw_validation -- --nocapture --test-threads=1

  hnsw-recall:
    name: "Certification: hnsw_recall_certification"
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          free-disk: true
      - name: Run HNSW recall certification
        timeout-minutes: 25
        run: cargo test --release --test hnsw_recall_certification -- --nocapture --test-threads=1

  sift-validation:
    name: "Certification: sift_validation"
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_sift == true }}
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
      - name: Run SIFT validation
        timeout-minutes: 30
        run: cargo test --release --test sift_validation -- --nocapture --test-threads=1

  competitive-bench:
    name: "Certification: competitive_bench"
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_competitive == true }}
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
      - name: Run competitive benchmark
        timeout-minutes: 30
        run: cargo test --release --test competitive_bench -- --nocapture --test-threads=1

  failpoint-tests:
    name: "Certification: failpoint_injections"
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: failpoints-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
      - name: Run failpoint tests
        env:
          RUST_BACKTRACE: 1
        run: >
          cargo test --features failpoints
          --test chaos_integrity
          --test wal_resilience
          --test crash_injection
          --
          --test-threads=1

  storage-persistence:
    name: "Certification: storage_persistence"
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          swap-mb: 4096
          free-disk: true
      - name: Run storage persistence & recovery tests
        timeout-minutes: 75
        run: >
          cargo test --release --features cli
          --test backend_tests
          --test storage
          --test durability_recovery
          --test derived_index_recovery
          --test index_reconstruction
          --test fjall_cold_copy_restore
          --test property_durability
          --test file_locking_stress
          --test schema_evolution
          --test gc
          --test mmap_index
          --test mutations
          --test antilocality_layout
          --test tombstone_ann_vstore
          --test multi_process_lock
          --test operational_metrics
          --test prefetch_benchmark
          --
          --test-threads=1

  text-index:
    name: "Certification: text_index_recovery"
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          swap-mb: 4096
      - name: Run text index recovery tests
        timeout-minutes: 45
        run: cargo test --release --test text_index_recovery -- --test-threads=1 --nocapture

  memory-concurrency:
    name: "Certification: memory_concurrency"
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          swap-mb: 4096
          free-disk: true
      - name: Run memory & concurrency heavy tests (batch 1 — fast)
        timeout-minutes: 30
        run: >
          cargo test --release
          --features rocksdb
          --test concurrency_parity
          --test edge_cases
          --
          --test-threads=1
          --nocapture
      - name: Run memory & concurrency heavy tests (batch 2 — memory)
        timeout-minutes: 90
        run: >
          cargo test --release
          --features rocksdb
          --test memory_brutality
          --test memory_export_import
          --test memory_api
          --test memory_telemetry
          --
          --test-threads=1
          --nocapture
      - name: Run fuzz proptest
        timeout-minutes: 30
        run: >
          cargo test --release
          --test fuzz_proptest
          --
          --test-threads=1

  other-heavy:
    name: "Certification: other_heavy"
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
        with:
          swap-mb: 4096
          free-disk: true
      # TBH-01: pre-test gate — fail fast if expected datasets are missing.
      # Without this, certification tests silently skip and Recall@10 can
      # regress without CI noticing. Runs before the download step so a
      # missing dataset surfaces the diagnostic table immediately.
      - name: Verify required benchmark datasets (TBH-01)
        run: bash scripts/verify_datasets.sh
      - name: Download benchmark datasets
        run: bash scripts/download_benchmark_datasets.sh
      - name: Run remaining heavy tests
        # ponytail: 45 min fit cached runs; bump to 60 so a cold release
        # compile (~40 min) + tests (~18 min) fits within the job window.
        timeout-minutes: 60
        run: |
          cargo test --release --features cli,arrow \
            --test benchmark_internal \
            --test benchmark_datasets \
            --test cli_tests \
            --test structured_api_v2 \
            --test python_sdk_boundary \
            --test hybrid_ranking_metrics \
            --test hybrid_retrieval_quality \
            --test basic_node \
            --test hardware_profiles \
            --test vector_scale_check \
            --test integration \
            --test multilingual_tokenizer_integration \
            --test columnar \
            -- \
            --test-threads=1
          cargo test --release \
            --package vantadb-server \
            --features prometheus \
            --test mcp_integration \
            --test e2e \
            --test benchmarks \
            --test server \
            -- \
            --test-threads=1
          cargo test --release \
            --package vantadb-mcp \
            --test mcp_tests \
            -- \
            --test-threads=1
          cargo test --release \
            --package vantadb \
            --lib index::tests::concurrent_insert_preserves_hnsw_invariants \
            -- \
            --nocapture

  mutation-test:
    name: "Certification: mutation_test (cargo-mutants)"
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Mutation testing is slow per design (one mutant = full cargo test cycle).
    # Scope to root crate only (-p vantadb) per plan file D5/risk table.
    # --check: only run mutants; --timeout 120: per-mutant cap (contract).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/rust-setup
      - name: Install cargo-mutants
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-mutants
      - name: Run cargo mutants (TBH-07)
        timeout-minutes: 100
        run: |
          mkdir -p benchmarks
          cargo mutants --check -p vantadb --timeout 120 \
            --output-json benchmarks/mutation_score.json || true
          # NB: cargo-mutants exits non-zero when mutants SURVIVE (which is
          # expected and useful — we want a score, not a binary pass/fail).
          # The artifact is the signal; gate enforcement lives in code review.
      - name: Upload mutation score report
        if: always()
        uses: actions/upload-artifact@4e7e4d1bb8e5ae8b5b8e6dad68a47e8afbd4d76a # v4.5.0
        with:
          name: mutation-score
          path: benchmarks/mutation_score.json
          if-no-files-found: warn
