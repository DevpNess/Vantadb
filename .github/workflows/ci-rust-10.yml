name: 'CI: Rust — Build & Lint + Tests'

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - '.config/nextest.toml'
      - '.github/workflows/ci-rust-10.yml'
      - 'deny.toml'
      - 'rust-toolchain.toml'
      - 'vantadb-*/**'
      - 'integrations/**'
      - '!web/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'benches/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - '.config/nextest.toml'
      - '.github/workflows/ci-rust-10.yml'
      - 'deny.toml'
      - 'rust-toolchain.toml'
      - 'vantadb-*/**'
      - 'integrations/**'
      - '!web/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: fmt-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/rust-setup
        with:
          toolchain: nightly
          components: rustfmt
          swap-mb: 0
          install-system-deps: false

      - name: Format Check
        run: cargo fmt --check

  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: lint-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/rust-setup
        with:
          components: clippy
          install-nextest: false
          install-system-deps: true
          swap-mb: 4096

      - name: Clippy Lints (core)
        # AUD-018: gate extended to vantadb-wasm / vantadb-server / vantadb-mcp.
        # Verified 2026-08-12: clippy clean on all three (exit 0, no warnings).
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  semver-checks:
    # RELEASE-01: gate so a breaking change in the public API can never publish.
    # release-plz.toml has semver_check = true, but nothing ran cargo-semver-checks
    # as a CI gate — this job closes that gap. Compares the current tree against
    # the latest published version on crates.io (0.4.x baseline vs 0.5.0).
    # Only `vantadb` is checked: vantadb-wasm is npm-distributed (release = false),
    # and python/server/mcp are not crates.io-distributed.
    name: Semver Checks (public API)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: semver-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/rust-setup
        with:
          toolchain: nightly
          install-nextest: false
          install-llvm-cov: false
          install-system-deps: true
          swap-mb: 4096

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@25f25a6eff908c77b40880d0b1f5d2a032b6e75a
        with:
          tool: cargo-semver-checks

      - name: Semver check (vantadb vs latest published)
        run: cargo semver-checks -p vantadb

  adr-gate:
    # REGLA-5: public API changes require an ADR. Without this job the rule
    # depended on agent memory — this is the mechanical gate. Runs only on PRs
    # (push to main already passed its own PR gate); compares the PR changeset
    # against the base SHA and fails when public API files changed unless an
    # ADR (docs/architecture/adr/ADR-NNN-*.md) was added OR the PR is explicitly
    # marked [no-adr] in the title/description with a justification.
    # Lazy by design: one depth-1 fetch + two-tree diff — no full history.
    name: ADR Gate (public API)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Fetch base SHA
        run: git fetch --depth 1 origin "${{ github.event.pull_request.base.sha }}"

      - name: Detect API surface + ADR changes
        id: detect
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          changed="$(git diff --name-only "$BASE" HEAD)"
          echo "--- changed files ---"
          printf '%s\n' "$changed"

          api=""
          for p in src/ vantadb-python/ vantadb-ts/ vantadb-server/ vantadb-wasm/; do
            if printf '%s\n' "$changed" | grep -q "^$p"; then
              api="${p%/}"
              break
            fi
          done
          adr="$(printf '%s\n' "$changed" | grep -E '^docs/architecture/adr/ADR-[0-9]{3}' || true)"

          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "adr=$adr" >> "$GITHUB_OUTPUT"

      - name: Fail — API change without ADR
        if: >-
          steps.detect.outputs.api != ''
          && steps.detect.outputs.adr == ''
          && !contains(github.event.pull_request.title, '[no-adr]')
          && !contains(github.event.pull_request.body, '[no-adr]')
        run: |
          echo "::error::Public API surface changed (${{ steps.detect.outputs.api }}) without an ADR."
          echo "::error::Add an ADR to docs/architecture/adr/ (format ADR-NNN, see ADR-0001) or, if no ADR is warranted, mark this PR '[no-adr]' in the title/description with a one-line justification."
          exit 1

      - name: Acknowledge [no-adr] marker
        if: >-
          steps.detect.outputs.api != ''
          && steps.detect.outputs.adr == ''
          && (contains(github.event.pull_request.title, '[no-adr]')
              || contains(github.event.pull_request.body, '[no-adr]'))
        run: |
          echo "::warning::PR marked [no-adr] — a reviewer must confirm the public API change needs no ADR."

      - name: OK — ADR present
        if: steps.detect.outputs.adr != ''
        run: 'echo "ADR present: ${{ steps.detect.outputs.adr }}"'

  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/rust-setup
        with:
          components: clippy
          install-nextest: true
          install-system-deps: true
          swap-mb: 8192

      - name: Cache benchmark dataset (GloVe 100d)
        id: cache-benchmark
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: data/benchmark/glove.6B.100d.txt
          key: glove-100d-${{ hashFiles('scripts/download_benchmark_datasets.sh') }}

      - name: Download benchmark datasets
        if: steps.cache-benchmark.outputs.cache-hit != 'true'
        run: bash scripts/download_benchmark_datasets.sh
        shell: bash

      - name: Run tests (Audit profile, core)
        timeout-minutes: 25
        run: cargo nextest run --profile audit --features "cli,arrow,tls,opentelemetry"

  test-windows:
    name: Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Rust (Windows)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@7e35be21c2b94d972b1143087fabc27d7dc881ef
        with:
          cache-bin: "false"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853
        with:
          tool: nextest

      - name: Cargo check (Windows smoke test)
        run: cargo check

      - name: Clippy (Windows)
        # CATEGORY: EXPERIMENTAL — excludes experimental crates.
        run: cargo clippy --workspace --all-targets --all-features --exclude vantadb-wasm --exclude vantadb-server --exclude vantadb-mcp -- -D warnings

      - name: Run quick integrity tests (Windows)
        shell: pwsh
        timeout-minutes: 30
        run: cargo nextest run --profile ci-windows --features "cli,arrow,tls,opentelemetry"

  test-macos:
    name: Tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/rust-setup
        with:
          components: clippy
          install-nextest: true

      - name: Install system dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install rocksdb llvm
          echo "ROCKSDB_LIB_DIR=$(brew --prefix rocksdb)/lib" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"

      - name: Cargo check (macOS smoke test)
        run: cargo check

      - name: Clippy (macOS)
        # CATEGORY: EXPERIMENTAL — excludes experimental crates.
        run: cargo clippy --workspace --all-targets --all-features --exclude vantadb-wasm --exclude vantadb-server --exclude vantadb-mcp -- -D warnings

      - name: Run tests (Audit profile, core)
        shell: bash
        timeout-minutes: 25
        run: cargo nextest run --profile audit --features "cli,arrow,tls,opentelemetry"

  msrv:
    name: MSRV Check (1.94.1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/rust-setup
        with:
          toolchain: 1.94.1
          install-nextest: false
          install-llvm-cov: false

      - name: cargo check (MSRV, core)
        run: cargo check

  minimal-versions:
    name: Minimal Versions Check (-Zminimal-versions)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # CATEGORY: EXPERIMENTAL — nightly-only -Zminimal-versions is unstable.
    # Failure does not indicate a regression in default builds.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/rust-setup
        with:
          toolchain: nightly
          install-nextest: false
          install-llvm-cov: false

      - name: cargo check (minimal-versions, core)
        run: cargo +nightly check -Zminimal-versions

  coverage:
    name: Code Coverage (cargo-llvm-cov)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/rust-setup
        with:
          components: llvm-tools-preview
          install-nextest: true
          install-llvm-cov: true
          install-system-deps: true
          swap-mb: 8192

      - name: Cache benchmark dataset (GloVe 100d)
        id: cache-benchmark
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: data/benchmark/glove.6B.100d.txt
          key: glove-100d-${{ hashFiles('scripts/download_benchmark_datasets.sh') }}

      - name: Download benchmark datasets
        if: steps.cache-benchmark.outputs.cache-hit != 'true'
        run: bash scripts/download_benchmark_datasets.sh
        shell: bash

      - name: Run tests with coverage
        timeout-minutes: 25
        # CATEGORY: EXPERIMENTAL — --exclude flags skip experimental crates (server, mcp, wasm).
        run: |
          cargo llvm-cov nextest \
            --profile audit \
            --workspace \
            --features "cli,arrow,tls,opentelemetry" \
            --exclude vantadb-wasm \
            --exclude vantadb-server \
            --exclude vantadb-mcp \
            --lcov --output-path lcov.info \
            --ignore-filename-regex '(tests/|benches/|packages/experimental|crash_injection)' \
            2>&1
          echo "--- Coverage Summary ---"
          cargo llvm-cov report \
            --ignore-filename-regex '(tests/|benches/|packages/experimental)'

      - name: Enforce coverage threshold (>=80%, ADR-015 coverage policy)
        shell: bash
        run: |
          # ADR-015-coverage-policy: root-gate 80% en CI (bindings/wasm/server/mcp miden en runners nativos)
          cargo llvm-cov report --json \
            --ignore-filename-regex '(tests/|benches/|packages/experimental)' \
            | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          data = d.get('data', [])
          if not data:
            print('ERROR: llvm-cov JSON has no data array')
            sys.exit(1)
          totals = data[0].get('totals', {})
          lines = totals.get('lines', {})
          pct = lines.get('percent', 0.0)
          ok = pct >= 80.0
          print(f'Line coverage: {pct:.1f}% {\"✅\" if ok else \"❌\"}')
          sys.exit(0 if ok else 1)
          "

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: warn

  wasm-test:
    name: WASM (wasm-pack browser tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # CATEGORY: BEST-EFFORT — WASM is Tier 3 Experimental.
    # Browser tests require wasm-pack + Chrome. Failures are non-blocking.
    continue-on-error: true
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.modified, 'vantadb-wasm/') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Run browser tests (Chrome)
        working-directory: vantadb-wasm
        run: wasm-pack test --chrome --headless

  experimental-check:
    name: Experimental Crates Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # CATEGORY: EXPERIMENTAL — server, MCP, WASM, and adapter crates. These
    # crates are not in workspace default-members; this job checks them so
    # regressions surface in CI. Must pass before merge.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/rust-setup
        with:
          install-system-deps: true
          swap-mb: 4096

      - name: Check experimental server + MCP + WASM crates
        run: cargo check -p vantadb-server -p vantadb-mcp -p vantadb-wasm

      - name: Check experimental adapter crates
        # providers/* are intentionally NOT workspace members (MSVC linker
        # crash on Windows) — check them individually via --manifest-path.
        run: |
          cargo check --manifest-path providers/openai/Cargo.toml
          cargo check --manifest-path providers/ollama/Cargo.toml
          cargo check --manifest-path providers/litellm/Cargo.toml

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/rust-setup
        with:
          install-nextest: false
          install-llvm-cov: false
          install-system-deps: false

      - name: Install cargo-audit
        uses: taiki-e/install-action@25f25a6eff908c77b40880d0b1f5d2a032b6e75a
        with:
          tool: cargo-audit

      - name: Security Audit
        # Ignores managed in .cargo/audit.toml + deny.toml [advisories]
        run: cargo audit

  miri:
    name: Miri (UB Detection)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Rust (Nightly + Miri)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly
          components: miri

      - name: Rust Cache
        uses: Swatinem/rust-cache@7e35be21c2b94d972b1143087fabc27d7dc881ef
        with:
          shared-key: miri-cache

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev clang librocksdb-dev

      - name: Miri Setup (core)
        run: cargo +nightly miri setup --manifest-path Cargo.toml -p vantadb
        env:
          MIRI_NO_HOST_FALLBACK: 1

      - name: Miri Test (core — unsafe patterns)
        # Run WITHOUT the `roaring` feature: croaring is C FFI that Miri cannot
        # execute. FilterBitset falls back to the pure-Rust Vec<u64> impl so the
        # engine's from_raw_parts/alignment paths still run under the checker.
        run: cargo +nightly miri test --manifest-path Cargo.toml -p vantadb --no-default-features --features "cli,fjall,memmap2,fs2" -- miri
        env:
          MIRI_NO_HOST_FALLBACK: 1
          # VantaHeader::new reads SystemTime::now() when opening the engine;
          # Miri blocks clock_gettime(REALTIME) under default isolation.
          MIRIFLAGS: "-Zmiri-disable-isolation"
          RUSTFLAGS: "-Zrandomize-layout"

      # ERR-009: Tree Borrows variant (catches violations Stacked Borrows misses,
      # e.g. RUSTSEC-2026-0002 class). Bonus: reuses cached sysroot from above.
      # CATEGORY: BEST-EFFORT — TB can flag false-positives; failures reviewed
      # manually, do not gate releases.
      - name: Miri Test (tree borrows - best effort)
        continue-on-error: true
        run: cargo +nightly miri test --manifest-path Cargo.toml -p vantadb --no-default-features --features "cli,fjall,memmap2,fs2" -- miri
        env:
          MIRI_NO_HOST_FALLBACK: 1
          MIRIFLAGS: "-Zmiri-disable-isolation -Zmiri-tree-borrows"
          RUSTFLAGS: "-Zrandomize-layout"

  deny:
    name: Dependency Policy Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/rust-setup
        with:
          install-nextest: false
          install-llvm-cov: false
          install-system-deps: false

      - name: Install cargo-deny
        uses: taiki-e/install-action@25f25a6eff908c77b40880d0b1f5d2a032b6e75a
        with:
          tool: cargo-deny

      - name: Dependency Policy Check
        run: cargo deny check

  sanitizer-asan:
    name: ASan (AddressSanitizer)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # CATEGORY: BEST-EFFORT — nightly ASan can produce false positives.
    # Failures are reviewed manually. Does not gate releases.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install nightly
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly
          components: rust-src

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev clang librocksdb-dev

      # CATEGORY: BEST-EFFORT — job-level continue-on-error covers this
      - name: Test with AddressSanitizer
        run: |
          cargo +nightly test \
            --target x86_64-unknown-linux-gnu \
            --package vantadb \
            --features "cli,arrow,tls,opentelemetry" \
            --config 'target.x86_64-unknown-linux-gnu.rustflags = ["-Zsanitizer=address", "-Cunsafe-allow-abi-mismatch=sanitizer"]' \
            -- \
            --skip test_benchmark_internal_10k \
            || echo "ASan reported issues (see log above)"
        env:
          ASAN_OPTIONS: "detect_stack_use_after_return=1:detect_leaks=1:halt_on_error=0"
          LSAN_OPTIONS: "suppressions=.lsan_suppressions"

  sanitizer-tsan:
    name: TSan (ThreadSanitizer)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # CATEGORY: BEST-EFFORT — nightly TSan is unstable.
    # Failures are reviewed manually. Does not gate releases.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install nightly
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev clang librocksdb-dev

      # CATEGORY: BEST-EFFORT — job-level continue-on-error covers this
      - name: Test with ThreadSanitizer
        run: |
          cargo +nightly test \
            --target x86_64-unknown-linux-gnu \
            --package vantadb \
            --features "cli,arrow,tls,opentelemetry" \
            --config 'target.x86_64-unknown-linux-gnu.rustflags = ["-Zsanitizer=thread", "-Cunsafe-allow-abi-mismatch=sanitizer"]' \
            -- \
            --skip sift1m_competitive_benchmark \
            --skip test_glove100_hnsw_basic \
            --skip test_triple_backend_parity_validation \
            --skip zero_dim_vector_search_empty \
            || echo "TSan reported issues (see log above)"
        env:
          TSAN_OPTIONS: "halt_on_error=0"
