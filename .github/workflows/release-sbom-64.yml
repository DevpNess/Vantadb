name: 'RELEASE: SBOM — Generate'

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/rust-setup
        with:
          install-nextest: false
          install-llvm-cov: false
          cache-bin: true
      - uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853
        with:
          tool: cargo-cyclonedx
      - run: cargo cyclonedx --format json --override-filename sbom
      - name: Generate npm SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm --package-lock-only --output-file sbom-web.json web/package.json
      - name: Generate Python SBOM
        run: |
          python3 -m pip install --user --quiet cyclonedx-bom
          python3 -m cyclonedx_py requirements - --pyproject vantadb-python/pyproject.toml --output-file sbom-python.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom
          path: sbom.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom-web
          path: sbom-web.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sbom-python
          path: sbom-python.json
