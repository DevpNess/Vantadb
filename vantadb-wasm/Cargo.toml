[package]
name = "vantadb-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "VantaDB WASM bindings for JavaScript/TypeScript"
repository = "https://github.com/ness-e/Vantadb"
homepage = "https://vantadb.dev"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]

[package.metadata.wasm-pack.profile.release]
# Explicit -Oz over default -Os: more aggressive binaryen size pass.
# wasm-opt defaults to true (-Os) since binaryen v121+ supports bulk-memory-opt;
# -Oz adds another size-reduction pass on top.
wasm-opt = ["-Oz"]

[dependencies]
vantadb = { path = "../", default-features = false, features = ["wasm"] }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
console_error_panic_hook = "0.1"
tracing-wasm = { version = "0.2", optional = true }
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
getrandom = { version = "0.4", features = ["wasm_js"] }

# Direct dep on 0.4 carries `wasm_js`: on wasm32 it unifies with the
# getrandom 0.4 pulled in transitively, so no alias is needed.
[features]
default = ["tracing-wasm"]
opfs = []

[package.metadata.cargo-machete]
ignored = ["getrandom"]

[dev-dependencies]
wasm-bindgen-test = "0.3"
# Same crate/version as the core (`twox-hash = "2.1.2"`): lets integration
# tests compute the deterministic `node_id` that import_records validates.
twox-hash = "2.1.2"

[lints]
workspace = true

