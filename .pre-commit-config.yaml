# Pre-commit hooks — https://pre-commit.com
# Install: pipx install pre-commit && pre-commit install && pre-commit autoupdate
# CI-01: gate para formatters — cada hook está scoped a su lenguaje/directorio.
repos:
  # ── Rust root (workspace) ────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --check
        language: system
        pass_filenames: false
        files: '\.rs$'

  # ── Python (vantadb-python/) ─────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.2
    hooks:
      # Linter. Sin --fix: falla si hay violaciones (check).
      - id: ruff-check
        files: '^vantadb-python/.*\.pyi?$'
      # Formatter. Escribe in-place y falla si reformatea (gate).
      - id: ruff-format
        files: '^vantadb-python/.*\.pyi?$'

  # ── Web (web/) — usa .prettierrc.json de la raíz (printWidth 100) ────────
  - repo: https://github.com/pre-commit/mirrors-prettier
    # Prettier version. Mirror archivado pero funcional para uso estándar.
    rev: v3.1.0
    hooks:
      - id: prettier
        files: '^web/.*\.(js|jsx|ts|tsx|css|scss|json|md|mdx)$'
        exclude: '^web/(\.next|node_modules)/|^web/package-lock\.json$'

  # ── Docs (docs/) — mirror local de gate-docs-21.yml ──────────────────────
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    # v0.23.2 = latest stable. v0.23.0+ requiere Node ≥ 22 (EOL Node 20/18).
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        # Mismo scope que CI (`docs/**/*.md` en gate-docs-21.yml) pero
        # filtrado por staged files. NO --fix: hook es gate, no formatter.
        files: '^docs/.*\.mdx?$'