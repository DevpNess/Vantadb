# getrandom backend for WebAssembly.
#
# `wasm32-unknown-unknown` has no OS RNG, so `getrandom` 0.3/0.4 refuse to
# compile without an explicit backend (compile_error in backends.rs). The
# 0.3.4 copy reaches the wasm graph transitively via ahash 0.8 / rand_core 0.9
# and cannot be bumped away (third-party pins). Select the Web Crypto (JS)
# backend for every wasm32 build — local, CI and wasm-pack honor this file.
# See https://docs.rs/getrandom#webassembly-support
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']
