[package]
name = "vantadb-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"
description = "VantaDB Desktop — Tauri v2 shell over the VantaDB core, with a typed multi-connection client contract."
license = "Apache-2.0"

# Own workspace (1 member = this crate), isolated from the repo-root workspace
# (vantadb, vantadb-python, vantadb-server, vantadb-mcp, vantadb-wasm) so that
# `cargo check -p vantadb` at the repo root stays invariant — no tauri/webview
# deps reach the root lockfile. Canonical Tauri standalone layout.
[workspace]
resolver = "2"
members = ["."]

[lib]
name = "vantadb_desktop_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "io-util", "sync"] }

# Core VantaDB engine, inlined (DESK-03). Subset of features only — never
# `cli`/`server`/`prometheus` (would pull axum/tokio heavy and duplicate the
# server binary logic). Path `../..` = repo root, resolved from desktop/src-tauri.
vantadb = { path = "../..", default-features = false, features = ["fjall", "fs2", "memmap2", "roaring", "advanced-tokenizer"] }
# Memory pipeline (MEM-53): L0 capture, recall, persona, scenes, skills,
# wiki ingest progress. Default features off — no LLM driver / tiktoken in
# the desktop build; LLM-free paths degrade gracefully (crate contract).
vanta-memory = { path = "../../vanta-memory", default-features = false }
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }

# Local ONNX embeddings (DESKTOP-EMBED-01): opt-in via
# `cargo tauri dev --features embed-local` (or build the same way). When off,
# the IPC command `vanta_embed_text` falls back to a deterministic dummy so
# the desktop still compiles and the UI can show a banner explaining why.
[features]
default = []
embed-local = ["vantadb/embed-local"]

[target.'cfg(unix)'.dependencies]
# Signal delivery for graceful sidecar shutdown (SIGINT to the MCP child).
libc = "0.2"

[dev-dependencies]
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "process", "io-util"] }
