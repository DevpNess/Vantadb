[package]
name = "vantadb-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Optional local server wrapper and MCP interface for VantaDB"

[dependencies]
vantadb = { path = "..", version = "0.5.0", features = ["cli", "server"] }
vantadb-mcp = { path = "../vantadb-mcp", version = "0.5.0" }
# ERR-CORE-02: bin-only human error chain (.context() en main).
anyhow = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "signal", "net", "time"] }

[dev-dependencies]
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
futures = "0.3"
tempfile = "3"
chrono = "0.4"
console = "0.16"
indicatif = "0.18"
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rustls = { version = "0.23", features = ["ring"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }

[features]
custom-allocator = ["mimalloc"]
jemalloc = ["vantadb/jemalloc", "dep:tikv-jemallocator"]
cli = ["vantadb/cli"]
tls = ["vantadb/tls"]
opentelemetry = ["vantadb/opentelemetry"]
prometheus = ["vantadb/prometheus"]


[dependencies.mimalloc]
version = "0.1"
optional = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies.tikv-jemallocator]
version = "0.6"
optional = true

[lints]
workspace = true
