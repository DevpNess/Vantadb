[advisories]
ignore = [
    # RUSTSEC-2023-0089: atomic-polyfill is unmaintained.
    # Transitive via postcard -> heapless (0.7.x) -> atomic-polyfill.
    # Owner: vanta-lead
    # Expiry: 2027-01-01
    # Tracked: postcard 2.0 migrates to heapless 0.9+ which uses portable-atomic.
    # VantaDB already has portable-atomic as a direct dependency.
    "RUSTSEC-2023-0089",

# RUSTSEC-2024-0436 (paste unmaintained): removed — advisory-not-detected,
    # tikv-jemalloc-ctl no longer pulls paste. Re-add only if it reappears.

    # RUSTSEC-2026-0253 (lru 0.16.4, use-after-free in LruCache::pop; CWE-416/415):
    # AUD-042 (2026-08-13): re-verified against crates.io + upstream. lru < 0.18.2
    # affected; patched >= 0.18.2. lru 0.16.4 is in the default graph via BOTH the
    # direct dep (lru = "0.16", Cargo.toml:33, cli_server.rs) AND tantivy 0.26.1,
    # which pins lru ^0.16.3 (verified via crates.io dependencies API). tantivy
    # 0.26.1 is the latest RELEASED version; tantivy main (0.27.0, unpublished,
    # verified via GitHub Cargo.toml) uses lru = "0.18.2" — the fix is upstream but
    # not yet on crates.io. Bumping direct lru alone does NOT clear the advisory
    # (0.16.4 remains transitively via tantivy) and would create a version split.
    # Exploitability is narrow: requires unwinding panics AND catch_unwind with key
    # types whose Drop can panic; VantaDB's cache keys are simple types (no
    # panicking Drop). RE-EVALUATE when tantivy >= 0.27.0 publishes to crates.io:
    # bump tantivy + direct lru to 0.18.2, then remove this allowlist entry.
    { id = "RUSTSEC-2026-0253", reason = "use-after-free in LruCache::pop (lru 0.16.4; direct dep + transitive via tantivy 0.26.1 which pins lru ^0.16; patched >= 0.18.2). AUD-042 verified 2026-08-13: fix merged in tantivy main (0.27.0 uses lru 0.18.2) but unpublished. Narrow exploitability (needs catch_unwind + panicking-Drop keys); VantaDB cache keys are simple types. Remove this entry when tantivy >= 0.27.0 publishes." },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
         "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "CC0-1.0",
         "BSL-1.0", "0BSD"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = false
# ERR-007 (2026-08-12): multiple-version "warn" clarificado a "warn codificado".
# Las duplicaciones son splits de MAJOR version de deps transitivas — no unificables
# con cargo update (cada caller exige su major). Bloat de binario solamente, sin
# advisory de seguridad (verificado 2026-08-12). Se documentan abajo, no se silencian
# a ciegas: si un crate aparece con una version NUEVA sin explicar, vuelve a alertar.
skip = [
    # hashbrown 0.14/0.15/0.16/0.17 — rustc-hash/parking_lot/ahash/edition2024 requieren majors distintos.
    "hashbrown",
    # windows-sys 0.52/0.59/0.60/0.61 — windows crates en cascada por major.
    "windows-sys",
    # syn 2.x/3.x — proc-macro2/serde_derive/tauri usan majors distintos.
    "syn",
    # thiserror 1.x/2.x — thiserror-core (2) vs deps legacy (1).
    "thiserror",
    # rand 0.8/0.9/0.10 — criterion/bolt/rand_core en majors distintos.
    "rand",
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
