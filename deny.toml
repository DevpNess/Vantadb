[advisories]
ignore = [
    # RUSTSEC-2023-0089: atomic-polyfill is unmaintained.
    # Transitive via postcard -> heapless (0.7.x) -> atomic-polyfill.
    # Owner: vanta-lead
    # Expiry: 2027-01-01
    # Tracked: postcard 2.0 migrates to heapless 0.9+ which uses portable-atomic.
    # VantaDB already has portable-atomic as a direct dependency.
    "RUSTSEC-2023-0089",

# RUSTSEC-2024-0436 (paste unmaintained): removed — advisory-not-detected,
    # tikv-jemalloc-ctl no longer pulls paste. Re-add only if it reappears.

    # RUSTSEC-2026-0002 (lru <0.16.3, Stacked Borrows in IterMut, CVSS 2.7 LOW):
    # NOT ignored and NOT flagged by the default gate. Verified 2026-08-09
    # (ERR-004): workspace direct lru = 0.16.4 (patched, >= 0.16.3).
    # The affected lru 0.12.5 exists only in Cargo.lock behind optional feature
    # `tui` (ratatui 0.28.1 -> lru ^0.12); it is NOT in the default resolve
    # graph and cargo-deny 0.19.9 reports nothing even with --all-features.
    # No fixed 0.12.x release exists (fix landed only in lru 0.16.3), and
    # ratatui 0.29+ (drops lru) is a breaking API change in src/tui/ — tracked
    # for the post-1.0 upgrade. Do NOT enable `tui` by default without reevaluating.
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
         "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "CC0-1.0",
         "BSL-1.0", "0BSD"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = false
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
