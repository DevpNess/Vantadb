[advisories]
ignore = [
    # RUSTSEC-2023-0089: atomic-polyfill is unmaintained.
    # Transitive via postcard -> heapless (0.7.x) -> atomic-polyfill.
    # Owner: vanta-lead
    # Expiry: 2027-01-01
    # Tracked: postcard 2.0 migrates to heapless 0.9+ which uses portable-atomic.
    # VantaDB already has portable-atomic as a direct dependency.
    "RUSTSEC-2023-0089",

# RUSTSEC-2024-0436 (paste unmaintained): removed — advisory-not-detected,
    # tikv-jemalloc-ctl no longer pulls paste. Re-add only if it reappears.

    # NOTE RUSTSEC-2026-0002 (lru <0.16.3): NOT ignored — informational/unsound,
    # cargo-deny reports it as warn only. Lives behind optional feature `tui`
    # (ratatui 0.28.1 -> lru 0.12.5); workspace direct lru is 0.16.4 (patched).
    # Tracked bump: ratatui 0.29+ post-1.0 (breaking API in src/tui/).
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
         "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "CC0-1.0",
         "BSL-1.0", "0BSD"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = false
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
