<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-label="SIFT1M (100K scale) HNSW construction speedup after Phase 2 optimizations. Balanced Cosine 2.18x, High Recall Cosine 2.14x, Balanced L2 2.80x, High Recall L2 2.37x, High Recall L2 Mmap 2.16x.">
  <title>SIFT1M — 100K scale HNSW construction speedup (Phase 2)</title>
  <rect width="760" height="420" fill="#FBF9F5"/>

  <!-- panel title -->
  <text x="30" y="40" fill="#000000" font-family="Inter,'SF Pro','Segoe UI',Arial,sans-serif" font-size="20" font-weight="700">SIFT1M HNSW construction — Phase 2 speedup</text>
  <text x="30" y="60" fill="#000000" font-family="'SF Mono','Cascadia Mono','Roboto Mono',Menlo,monospace" font-size="12" opacity="0.65">real data · docs/operations/BENCHMARKS.md · 100K vectors, 128d</text>

  <!-- axes -->
  <line x1="70" y1="330" x2="700" y2="330" stroke="#000000" stroke-width="1.5"/>
  <line x1="70" y1="330" x2="70" y2="80" stroke="#000000" stroke-width="1.5"/>

  <!-- y gridlines / labels -->
  <g font-family="'SF Mono','Cascadia Mono','Roboto Mono',Menlo,monospace" font-size="11" fill="#000000" opacity="0.6">
    <text x="20" y="333">0s</text><text x="-6" y="267">125s</text><text x="-6" y="205">250s</text><text x="-6" y="143">375s</text><text x="-12" y="81">500s</text>
    <line x1="70" y1="250" x2="700" y2="250" stroke="#000000" stroke-width="0.5" opacity="0.15"/>
    <line x1="70" y1="170" x2="700" y2="170" stroke="#000000" stroke-width="0.5" opacity="0.15"/>
    <line x1="70" y1="90" x2="700" y2="90" stroke="#000000" stroke-width="0.5" opacity="0.15"/>
  </g>

<!-- scale: y = 330 - (sec * 0.5) ; 500s -> y 80 ; groups at x = 70 + n*126 -->
  <g font-family="'SF Mono','Cascadia Mono','Roboto Mono',Menlo,monospace" font-size="10" fill="#000000">
    <!-- 1: Balanced Cos 139.4->63.7 2.18x -->
    <rect x="74"  y="260.3" width="34" height="69.7"  fill="#D9D3C4"/>
    <rect x="110" y="298.2" width="34" height="31.8"  fill="#FF4400"/>
    <text x="74"  y="248" fill="#000000">139s</text>
    <text x="112" y="285" fill="#000000">64s</text>
    <text x="84"  y="372" fill="#FF4400" font-weight="bold">2.18×</text>

    <!-- 2: High Recall Cos 390.8->182.2 2.14x -->
    <rect x="196" y="134.6" width="34" height="195.4" fill="#D9D3C4"/>
    <rect x="232" y="238.9" width="34" height="91.1"  fill="#FF4400"/>
    <text x="186" y="126" fill="#000000">391s</text>
    <text x="234" y="225" fill="#000000">182s</text>
    <text x="212" y="372" fill="#FF4400" font-weight="bold">2.14×</text>

    <!-- 3: Balanced L2 191.4->68.4 2.80x -->
    <rect x="322" y="234.3" width="34" height="95.7"  fill="#D9D3C4"/>
    <rect x="358" y="295.8" width="34" height="34.2"  fill="#FF4400"/>
    <text x="326" y="222" fill="#000000">191s</text>
    <text x="360" y="282" fill="#000000">68s</text>
    <text x="340" y="372" fill="#FF4400" font-weight="bold">2.80×</text>

    <!-- 4: High Recall L2 462.2->194.5 2.37x -->
    <rect x="448" y="98.9"  width="34" height="231.1" fill="#D9D3C4"/>
    <rect x="484" y="232.8" width="34" height="97.2"  fill="#FF4400"/>
    <text x="452" y="88"  fill="#000000">462s</text>
    <text x="486" y="219" fill="#000000">195s</text>
    <text x="466" y="372" fill="#FF4400" font-weight="bold">2.37×</text>

    <!-- 5: High Recall L2 Mmap 411.2->189.8 2.16x -->
    <rect x="574" y="124.4" width="34" height="205.6" fill="#D9D3C4"/>
    <rect x="610" y="235.1" width="34" height="94.9"  fill="#FF4400"/>
    <text x="578" y="113" fill="#000000">411s</text>
    <text x="612" y="222" fill="#000000">190s</text>
    <text x="592" y="372" fill="#FF4400" font-weight="bold">2.16×</text>
  </g>

  <!-- category labels -->
  <g font-family="Arial,'SF Pro Text',system-ui,Arial,sans-serif" font-size="11" fill="#000000">
    <text x="74"  y="348">Bal Cos</text>
    <text x="188" y="348" font-size="10" opacity="0.9">HiRecall Cos</text>
    <text x="322" y="348">Bal L2</text>
    <text x="440" y="348" font-size="10">HiRecall L2</text>
    <text x="558" y="348" font-size="10">HiRecall L2 Mmap</text>
  </g>

  <!-- legend -->
  <g>
    <rect x="30" y="392" width="14" height="14" fill="#D9D3C4"/>
    <text x="50" y="404" fill="#000000" font-family="Arial,sans-serif" font-size="13">Phase 1 (before)</text>
    <rect x="200" y="392" width="14" height="14" fill="#FF4400"/>
    <text x="220" y="404" fill="#000000" font-family="Arial,sans-serif" font-size="13">Phase 2 (after)</text>
  </g>
</svg>