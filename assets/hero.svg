<svg xmlns="http://www.w3.org/2000/svg" width="600" height="236" viewBox="0 0 600 236" role="img" aria-label="VantaDB — Embedded Rust engine for durable, hybrid vector memory">
  <title>VantaDB — Embedded Rust engine for durable, hybrid vector memory</title>
  <rect width="600" height="236" fill="#FBF9F5"/>

  <!-- brand mark: HNSW graph motif -->
  <g fill="none" stroke-width="1.5" aria-hidden="true">
    <line x1="404" y1="52" x2="470" y2="34" stroke="#FF5500" opacity="0.55"/>
    <line x1="470" y1="34" x2="548" y2="64" stroke="#FF5500" opacity="0.5"/>
    <line x1="470" y1="34" x2="516" y2="120" stroke="#FF5500" opacity="0.6"/>
    <line x1="404" y1="52" x2="516" y2="120" stroke="#000000" opacity="0.85"/>
    <line x1="404" y1="52" x2="340" y2="126" stroke="#000000" opacity="0.7"/>
    <line x1="548" y1="64" x2="516" y2="120" stroke="#000000" opacity="0.6"/>
    <line x1="516" y1="120" x2="436" y2="150" stroke="#FF4400" opacity="0.55"/>
    <line x1="516" y1="120" x2="596" y2="156" stroke="#000000" opacity="0.5"/>
    <line x1="596" y1="156" x2="516" y2="120" stroke="#000000" opacity="0.5"/>
  </g>
  <g aria-hidden="true">
    <circle cx="404" cy="52" r="6" fill="#000000"/>
    <circle cx="470" cy="34" r="7" fill="#FF4400"/>
    <circle cx="548" cy="64" r="6" fill="#000000"/>
    <circle cx="340" cy="126" r="5" fill="#000000" opacity="0.85"/>
    <circle cx="516" cy="120" r="9" fill="#FF4400"/>
    <circle cx="436" cy="150" r="5" fill="#000000"/>
    <circle cx="596" cy="156" r="5" fill="#FF4400" opacity="0.9"/>
  </g>

  <!-- headline -->
  <text x="36" y="78" fill="#000000" font-family="Inter, 'SF Pro', 'Segoe UI', system-ui, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-1">VantaDB</text>

  <!-- tagline -->
  <text x="38" y="110" fill="#000000" font-family="Inter, 'SF Pro', 'Segoe UI', system-ui, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="-0.2">Embedded Rust engine for durable, local</text>
  <text x="38" y="132" fill="#000000" font-family="Inter, 'SF Pro', 'Segoe UI', system-ui, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="-0.2">memory and hybrid vector retrieval.</text>

  <!-- capability chips (tech/mono) -->
  <g font-family="'SF Mono', 'Cascadia Mono', 'Roboto Mono', Menlo, monospace" font-size="11.5" letter-spacing="0.4">
    <rect x="38" y="158" width="116" height="24" rx="12" fill="none" stroke="#000000" stroke-width="1.2"/>
    <text x="61" y="174" fill="#000000">no servers</text>

    <rect x="152" y="158" width="120" height="24" rx="12" fill="#000000"/>
    <text x="168" y="174" fill="#FBF9F5">hybrid search</text>

    <rect x="280" y="158" width="72" height="24" rx="12" fill="none" stroke="#000000" stroke-width="1.2"/>
    <text x="298" y="174" fill="#000000">WAL-safe</text>
  </g>

  <!-- baseline stat -->
  <g aria-label="Baseline: 441 microsecond p99 search at 100K vectors, 3636 queries per second">
    <rect x="38" y="200" width="150" height="22" rx="4" fill="#FF4400"/>
    <text x="48" y="215" fill="#000000" font-family="'SF Mono','Cascadia Mono','Roboto Mono',Menlo,monospace" font-size="12" font-weight="700">441µs · 3,636 qps</text>
  </g>
</svg>