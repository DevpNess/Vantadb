[package]
name = "vanta-memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "VantaDB Memory Engine: four-layer (L0-L3) LLM-driven memory pipeline (port of TDAM, host-neutral)"
publish = false

[dependencies]
vantadb = { path = "../", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tracing = "0.1"
# Only pulled in with `llm-driver` (standalone OpenAI-compatible runner).
# Matches the workspace pattern (src/llm.rs: reqwest blocking + json).
reqwest = { version = "0.12", features = ["json", "blocking"], optional = true }

[dev-dependencies]
tempfile = "3"
# MEM-46: unification enables `vantadb::llm` (EmbeddingProvider trait) during
# tests so D19 fakes can implement the real core trait. Production default
# build stays lean (no reqwest from the core).
vantadb = { path = "../", features = ["remote-inference"] }

[features]
# LLM-driven paths (L1 extraction, L2 scenes, L3 persona, recall composer).
# Default off: the crate degrades to LLM-free capture/dedup/store (never blocks,
# never loses data) when no LLM runner is plugged in. Enables the real HTTP
# transport of the standalone runner + the async wrapper trait.
llm-driver = ["dep:reqwest"]

# MEM-46: expose `core_embedding_hook` (wraps `vantadb::llm::get_embedding_provider`)
# so hosts can attach real embeddings to L1 writes. Default off — records stay
# vector-free unless a hook is injected into `L1DedupConfig`.
embeddings = ["vantadb/remote-inference"]

# Deterministic fake LLM runner for tests (see MEM-08b).
mock = []

# Persistent backend for the `vanta-seed` binary (MEM-39). Without it the
# binary falls back to in-memory storage (import is not persisted).
fjall = ["vantadb/fjall"]

[lints]
workspace = true