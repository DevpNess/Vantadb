[toolchain]
channel = "1.95.0"
components = ["rustfmt", "clippy", "rust-src"]
# Targets: x86_64-pc-windows-msvc es el target local (Windows dev).
# El runner CI (ubuntu-latest) usa su target nativo; no se necesita listarlo explícitamente.
# macOS/WASM se listan para que rustup los instale con la toolchain (sin rustup target add manual).
# DEUDA (FIND-52, 2026-09-02): `wasm-pack build --release` aborta con STATUS_STACK_BUFFER_OVERRUN
# (0xc0000409) SOLO en host Windows/MSVC con este pin 1.95.0 — es __fastfail mal-reportado
# (rust#141757, rust#120955); los fixes LLVM wasm-ld landed en 1.97 y el estable actual es 1.98.
# NO bloquea release: release-npm-61.yml corre ubuntu-latest. Bump de canal = tarea separada
# (verificar toolchains locales + re-certificar benches antes de subir).
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "wasm32-unknown-unknown",
]
